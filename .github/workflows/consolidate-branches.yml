name: Consolidate reviewed branches into main

on:
  push:
    branches: [main]
    paths: [.github/workflows/consolidate-branches.yml]

permissions:
  contents: write

concurrency:
  group: ledgerguard-branch-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Merge audited histories, preserve verified files and atomically retire branch refs
        shell: python
        run: |
          import collections, json, os, subprocess
          from pathlib import Path
          BASE = 'e0a1f2a77b84e74e004ee2f093f563da9e1b0816'
          AUDIT_COMMIT = '1de11237756c0434022c7a54eb23b95fb22d26b5'
          BRANCHES = {
              'p05-async-payments': '9c3faa8d9c2d54576f4f6cfafb3b3a7e9b764698',
              'p05-staging': 'a9e1db246e7933566cb133d9b3ac47dee804a3c1',
              'p06-payment-adjustments': '578650fe2e3ba0d4cefc4a1be92ed40f5018d941',
              'p07a-source-export': '3b36983a9476839d77f681d4cd0fbe1699f82c48',
              'p08c-materialize': '5a55f738c05a6914652d31672bb23a623ce6dbcd',
          }
          def git(*args, data=None):
              return subprocess.check_output(['git', *args], input=data).decode().strip()
          def remote_heads():
              return {ref.removeprefix('refs/heads/'):sha for sha,ref in
                      (line.split() for line in git('ls-remote','--heads','origin').splitlines())}
          def source_unchanged(ref):
              allowed = {'.github/workflows/consolidate-branches.yml',
                         'docs/evidence/branch-consolidation-audit.json',
                         'docs/evidence/branch-consolidation-audit.md'}
              changed = set(git('diff','--name-only',BASE,ref).splitlines())
              assert changed <= allowed, 'Unaudited application/source changes: '+repr(changed-allowed)
          head = os.environ['GITHUB_SHA']
          expected = {'main':head, **BRANCHES}
          git('fetch','--no-tags','origin','+refs/heads/*:refs/remotes/origin/*')
          assert remote_heads() == expected, 'Remote heads moved or an unreviewed branch appeared'
          assert git('rev-parse','HEAD') == head
          assert git('rev-parse','HEAD^') == AUDIT_COMMIT, 'Unexpected approval parent'
          source_unchanged(head)
          audit = json.loads(Path('docs/evidence/branch-consolidation-audit.json').read_text())
          assert audit['reviewed_main'] == BASE
          assert audit['reviewed_main_tree'] == git('rev-parse',BASE+'^{tree}')
          assert {row['branch']:row['sha'] for row in audit['branches']} == BRANCHES
          exact = audit['branches'][0]
          assert exact['branch'] == 'p05-async-payments' and len(exact['files']) == 39
          assert all(item['status'] in ('IDENTICAL_TO_MAIN','EXACT_CONTENT_IN_MAIN_HISTORY') for item in exact['files'])
          transport_rules = {
              'p05-staging': ('.p05/', '.github/workflows/p05-staging.yml'),
              'p06-payment-adjustments': ('.p06-bundle/', '.github/workflows/p06-source-export.yml'),
              'p07a-source-export': ('.github/workflows/export-p07a-source.yml',),
              'p08c-materialize': ('.github/p08c-payload.part-', '.github/workflows/p08c-materialize.yml'),
          }
          for row in audit['branches'][1:]:
              assert not row['files'], 'Unreviewed source delta outside a transport payload'
              assert all(any(path.startswith(prefix) for prefix in transport_rules[row['branch']]) for path in row['changed_paths'])
          # The export-only branch's migration compatibility fix is already in main.
          migration_test = git('show',BASE+':backend/src/test/java/lab/ledgerguard/PaymentAdjustmentReliabilityIT.java')
          assert 'WHERE success AND version::integer BETWEEN 1 AND 8' in migration_test
          assert "WHERE success AND version='8'" in migration_test
          git('cat-file','-e',BASE+':backend/src/main/resources/db/migration/V7__p05_async_payment_reliability.sql')
          # Do not execute or install alternate transport archives. In particular the
          # staging draft contains a second V7 migration and P08C's old digest mismatches.
          # The complete draft blobs remain reachable through the merge parents.
          resolutions = {
              'p05-async-payments':'All 39 changed files already match current main or an exact earlier main blob; retain the newer verified versions.',
              'p05-staging':'Retain transport archive and patch in history only. Its alternate messaging implementation and conflicting V7 migration must not replace the delivered P05-P08E system.',
              'p06-payment-adjustments':'Retain transport archive in history only. Keep the subsequently delivered and verified P06 adjustment API, accounting rules, tests and later fixes.',
              'p07a-source-export':'Retain the obsolete source-export workflow in history only. Its forward-compatible V8 migration assertions are already present in main.',
              'p08c-materialize':'Retain the old materializer and unverified transport archive in history only; its historical expected archive checksum differs. Keep the delivered P08C-P08E UI, scoped auth fixtures and secret-safe evidence rules.',
          }
          compact = []
          for row in audit['branches']:
              items = row['files'] + [item for payload in row['payloads'] for item in payload['files']]
              compact.append({
                  'branch':row['branch'], 'tip':row['sha'], 'merge_base':row['merge_base'],
                  'unique_commits_before_consolidation':int(row['unique_commits']),
                  'resolution':resolutions[row['branch']],
                  'content_comparison_counts':dict(collections.Counter(item['status'] for item in items)),
                  'changed_paths':row['changed_paths'],
                  'archives':[{key:payload[key] for key in ('sha256','historical_expected_sha256','checksum_matches')} for payload in row['payloads']],
              })
          unique_count = int(git('rev-list','--count',*BRANCHES.values(),'^'+BASE))
          report = {
              'operation':'Preserve audited branch histories in a six-parent merge and atomically publish main/delete the five exact branch refs.',
              'reviewed_main':BASE, 'pre_merge_main':head,
              'raw_audit_commit':AUDIT_COMMIT,
              'unique_branch_commits_preserved':unique_count,
              'application_source_changed':False,
              'conflict_policy':'Retain verified main contents; preserve already-integrated source and superseded transport candidates through merge ancestry, not by restoring obsolete files.',
              'deletion_policy':'Atomic push; explicit expected-tip leases for each removed branch; main must fast-forward. Abort on any concurrent ref or unexpected source change.',
              'verification_scope':'Git source/blob comparison, transport archive inspection, current migration assertion check, all-parent ancestry and remote-ref checks; not a new claim of a full application test campaign.',
              'run_url':'https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID'],
              'branches':compact,
          }
          Path('docs/evidence/branch-consolidation-audit.json').write_text(json.dumps(report,indent=2)+'\n')
          lines = ['# Branch consolidation', '',
                   'All five reviewed branch histories are retained by a six-parent merge into `main`.',
                   'The merge and removal of their exact remote refs are published in one atomic transaction.', '',
                   '## Source preservation', '',
                   'Verified application files, migrations, tests, existing CI and P08E evidence remain byte-for-byte unchanged from `'+BASE+'`.',
                   'The only retained file changes from this housekeeping operation are this report and its JSON companion; the one-use workflow is retired afterward.',
                   'This is a history consolidation, not a replacement of newer verified code with earlier staging candidates.', '',
                   'Distinct branch commits preserved: '+str(unique_count)+'.',
                   'Full raw source comparisons remain available at audit commit `'+AUDIT_COMMIT+'`; this compact report avoids duplicating obsolete source in the current tree.', '',
                   '## Branch resolutions', '']
          for row in compact:
              lines += ['### '+row['branch'], '', 'Tip: `'+row['tip']+'`.', '', row['resolution'], '',
                        'Compared contents: '+json.dumps(row['content_comparison_counts'])+'.', '']
          lines += ['## Verification and safety', '',
                    'Before publication: exact remote-tip checks, unchanged application files, transport-path allowlist, 39 exact P05 source matches, existing migration-compatibility assertions, every branch tip as an ancestor of the merge, and a dry-run atomic push.',
                    'Publication uses explicit expected-tip leases for deleted refs and a non-rewriting fast-forward update of main. A stale branch fails the entire transaction.',
                    'After publication, the workflow checks that the remote has exactly one branch, main, at the merge commit.',
                    'The complete application suite is not claimed to have been rerun on this history-only merge; existing P08E verification retains its original source-SHA attribution.', '',
                    'Execution: '+report['run_url'], '']
          Path('docs/evidence/branch-consolidation-audit.md').write_text('\n'.join(lines))
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          git('add','docs/evidence/branch-consolidation-audit.json','docs/evidence/branch-consolidation-audit.md')
          git('diff','--cached','--check')
          tree = git('write-tree')
          parents = ['-p',head]
          for sha in BRANCHES.values(): parents += ['-p',sha]
          message = ('merge: consolidate all five reviewed branch histories into main [skip ci]\n\n'
                     'Retain the verified P08E application tree. The 39 P05 branch source files are already in main history. '
                     'Retain obsolete staging/export/materializer candidates in ancestry without reintroducing conflicting migrations or earlier implementations. '
                     'See docs/evidence/branch-consolidation-audit.md for the per-branch source audit and resolutions.\n')
          merge = git('commit-tree',tree,*parents,data=message.encode())
          source_unchanged(merge)
          for sha in [head,*BRANCHES.values()]: git('merge-base','--is-ancestor',sha,merge)
          assert remote_heads() == expected, 'Concurrent change before atomic publication'
          push = ['push','--atomic']
          push += ['--force-with-lease=refs/heads/'+name+':'+sha for name,sha in BRANCHES.items()]
          push += ['origin',merge+':refs/heads/main'] + [':refs/heads/'+name for name in BRANCHES]
          git(*push[:2],'--dry-run',*push[2:])
          git(*push)
          assert remote_heads() == {'main':merge}, 'Remote verification did not show only the merged main branch'
          result = {'status':'PASS','merge_commit':merge,'only_remote_branch':'main','preserved_unique_commits':unique_count,'deleted_branches':list(BRANCHES),'application_source_changed':False}
          print(json.dumps(result,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('## Branch consolidation: PASS\n\n```json\n'+json.dumps(result,indent=2)+'\n```\n')
