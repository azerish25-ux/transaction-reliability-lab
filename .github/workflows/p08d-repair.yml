name: P08D guarded repair delivery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p08d-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply checksum-verified source repair
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, subprocess
          encoded = ''''''
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='42deeb19729e85b9a454a35a9f976df8da62f903a1a45f72462c4ab321ec8ac5'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PY
      - name: Verify strict sources and all production-client regressions
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm --prefix frontend run verify
      - name: Publish tested changes without overwriting concurrent work
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/p08d-ui.tsx frontend/src/schedule-api.ts frontend/tests/e2e/p08d-fixtures.ts frontend/tests/e2e/p08d.spec.ts tests/contracts/p08d-client.test.cjs scripts/assert-p08d-evidence docs/implementation/P08D_REQUIREMENTS.json docs/architecture/adr/0021-p08d-customer-schedule-management.md
          git diff --cached --check
          git commit -m 'fix(p08d): align rejected occurrence wire states and canonical browser inputs'
          git push origin HEAD:main
          echo "PUBLISHED_SOURCE_SHA=$(git rev-parse HEAD)"
      - name: Preserve client evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p08d-repair-client-${{ github.run_id }}
          include-hidden-files: true
          retention-days: 7
          path: .evidence/client/
