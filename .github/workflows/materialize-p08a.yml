name: Materialize reviewed P08A source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-p08a.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ledgerguard-p08a-materialization
  cancel-in-progress: false

jobs:
  materialize:
    name: Verify and publish reviewed P08A source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      P08A_ARCHIVE_SHA256: 63b4c1f910996ed826509cb35d03987c7cb7d864aa9c27f1565a60e6b7b41060
    steps:
      - name: Check out staging commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Configure Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Configure Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reassemble checksum-pinned source
        shell: bash
        run: |
          set -euo pipefail
          chunks=(
            "dac7d6456cc8c97533e435eef14d468f3b8a9311:416152b8ed2de6c0eacf709e05db1e65f0d217e15c3c9733cb329ab19c8d1a12"
            "ff436fbb78258cdc872f1b01430478bda0616258:614e0d89905917f668445070e9ba1d45e0e23788b9ecc2b9078908b7b03dcfee"
            "d86c14190a2ad7b126c11b9a7523e6eaaf5b7ed4:2c9f2602ef74ca58dc992aa4a3bbaf4835541a8832be4f2d9dd9d4d799243dd3"
            "a5ae1554f93c04e2c9a9963b1095cdb48ff452de:411958cdd6aad03a4891c33212b5f47f2cfb144743488d2969ab4fa2b336d677"
            "ffe23ce79be070998193181879a55a604e3e6c3e:787d1cbc7de98aa84a6a83e318f44c7c44153294e30e46392870803ac63afb25"
          )
          : > /tmp/p08a-source.tar.gz
          index=0
          for item in "${chunks[@]}"; do
            sha="${item%%:*}"
            expected="${item#*:}"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/blobs/$sha" \
              -o /tmp/p08a-blob.json
            python3 - "$sha" "$index" <<'PY'
          import base64, json, pathlib, sys
          sha, index = sys.argv[1], sys.argv[2]
          payload = json.loads(pathlib.Path('/tmp/p08a-blob.json').read_text(encoding='utf-8'))
          if payload.get('sha') != sha or payload.get('encoding') != 'base64':
              raise SystemExit(f'unexpected blob response for {sha}')
          data = base64.b64decode(payload['content'].replace('\n', ''), validate=True)
          pathlib.Path(f'/tmp/p08a-chunk-{index}').write_bytes(data)
          PY
            printf '%s  %s\n' "$expected" "/tmp/p08a-chunk-$index" | sha256sum --check --strict
            cat "/tmp/p08a-chunk-$index" >> /tmp/p08a-source.tar.gz
            index=$((index + 1))
          done
          printf '%s  %s\n' "$P08A_ARCHIVE_SHA256" /tmp/p08a-source.tar.gz | sha256sum --check --strict
          python3 <<'PY'
          import pathlib, tarfile
          archive = pathlib.Path('/tmp/p08a-source.tar.gz')
          with tarfile.open(archive, 'r:gz') as source:
              for member in source.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f'unsafe archive member: {member.name}')
              source.extractall('.', filter='data')
          PY
      - name: Print strict-typecheck diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo '--- frontend/src/App.tsx failing ranges ---'
          nl -ba frontend/src/App.tsx | sed -n '175,200p;280,305p;340,365p;420,460p;515,535p;560,580p;648,670p'
          echo '--- frontend/src/money.ts failing range ---'
          nl -ba frontend/src/money.ts | sed -n '15,32p'
      - name: Generate exact frontend lock and verify source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/lab scripts/test-client scripts/assert-p08a-evidence
          npm install --package-lock-only --ignore-scripts --prefix frontend --no-audit --no-fund
          npm ci --ignore-scripts --prefix frontend --no-audit --no-fund
          npm --prefix frontend run verify
          python3 -m py_compile scripts/lab scripts/assert-p08a-evidence
          python3 - <<'PY'
          import json, pathlib
          for name in ('backend/src/main/resources/openapi/p08a-ui.json', 'docs/implementation/P08A_REQUIREMENTS.json'):
              json.loads(pathlib.Path(name).read_text(encoding='utf-8'))
          PY
          ./mvnw -B -ntp -f backend/pom.xml -DskipTests package
          docker compose --env-file .env.example -f compose.yaml config --quiet
          docker compose --env-file .env.example -f compose.yaml -f compose.p07.yaml config --quiet
      - name: Commit reviewed ordinary source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No reviewed source changes found.' >&2; exit 1; }
          git commit -m "feat(p08a): add real customer product journey" \
            -m "Add the same-origin React product shell, real authentication/session behavior, live balances, authorized history and transaction detail, responsive accessibility states, Playwright/axe journeys, Compose serving, traceability and the candidate P08A gate."
          git push origin HEAD:main
