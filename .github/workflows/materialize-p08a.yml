name: Materialize reviewed P08B source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-p08a.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ledgerguard-p08b-materialization
  cancel-in-progress: false

jobs:
  materialize:
    name: Verify and publish reviewed P08B source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      P08B_ARCHIVE_SHA256: 792d65ad3215f5c8e85fbc84be1f17f1e627f14db3b261f43447b973e0771542
    steps:
      - name: Check out staging commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Configure Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Configure Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Reassemble checksum-pinned P08B source
        shell: bash
        run: |
          set -euo pipefail
          chunks=(
            "407bbbb79947e071fd294b8b7dadc154d3c6f2f0:fa6ca63b39fd5db7f36af29a64fe48d70194dff25166acec14744d860c2e4d11"
            "ba7022a827bf525adabd8a817a586a55dec422ed:6b5fb24c530818cb86b57d5e2af138841cf222c5eea2a2d77a5ac675c29a9dc1"
            "f0de589d30983f5c68b58c83bee3c281bf30428c:61a1f05f4576929affe43066479f07bf557bb3d04e12e3846592216402ffa14d"
            "46e923255c916c14c71417402eab47b5a32a2aa0:414d44113b9bc5959ed64ea40f761030330381284b08d0bea66b770eca65d807"
            "ae5504ee8623227a9ca62b934c19a394d476ffb4:c7cf2808d8b924a10f90b7373dfbee95ed87371a960d71e976a8fe6e33d2278e"
            "3737aa594c33f9e7c91ecf5668bb5e5a00eea86d:b77d4c837feea588e504fd459f60590adaea4181fb8f7b33b022582d3ab493af"
            "820aab2124944d470357aa0fdd8a047f592c86dc:48ecdcc2e59df5050a876b3204136394757f2c9580b6044e0a39430301f337a3"
          )
          : > /tmp/p08b-source.tar.gz
          index=0
          for item in "${chunks[@]}"; do
            sha="${item%%:*}"
            expected="${item#*:}"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/blobs/$sha" \
              -o /tmp/p08b-blob.json
            python3 - "$sha" "$index" <<'PY'
          import base64, json, pathlib, sys
          sha, index = sys.argv[1], sys.argv[2]
          payload = json.loads(pathlib.Path('/tmp/p08b-blob.json').read_text(encoding='utf-8'))
          if payload.get('sha') != sha or payload.get('encoding') != 'base64':
              raise SystemExit(f'unexpected blob response for {sha}')
          data = base64.b64decode(payload['content'].replace('\n', ''), validate=True)
          pathlib.Path(f'/tmp/p08b-chunk-{index}').write_bytes(data)
          PY
            printf '%s  %s\n' "$expected" "/tmp/p08b-chunk-$index" | sha256sum --check --strict
            cat "/tmp/p08b-chunk-$index" >> /tmp/p08b-source.tar.gz
            index=$((index + 1))
          done
          printf '%s  %s\n' "$P08B_ARCHIVE_SHA256" /tmp/p08b-source.tar.gz | sha256sum --check --strict
          python3 <<'PY'
          import pathlib, tarfile
          archive = pathlib.Path('/tmp/p08b-source.tar.gz')
          expected = {
              '.github/workflows/pr.yml',
              'README.md',
              'backend/src/main/java/lab/ledgerguard/http/OpenApiController.java',
              'backend/src/main/resources/openapi/p08b-ui.json',
              'docs/architecture/adr/0019-p08b-replay-safe-customer-money-movement.md',
              'docs/implementation/P08B_REQUIREMENTS.json',
              'docs/implementation/PROGRESS.md',
              'docs/implementation/RELEASE_READINESS.md',
              'frontend/package.json',
              'frontend/src/intent-store.ts',
              'frontend/src/main.tsx',
              'frontend/src/p08b-core.ts',
              'frontend/src/p08b-ui.tsx',
              'frontend/src/p08b.css',
              'frontend/src/product-router.tsx',
              'frontend/tests/e2e/p08b.spec.ts',
              'frontend/tsconfig.core.json',
              'scripts/assert-p08b-evidence',
              'scripts/test-client',
              'tests/contracts/p08b-client.test.cjs',
          }
          with tarfile.open(archive, 'r:gz') as source:
              members = source.getmembers()
              names = {member.name.removeprefix('./') for member in members if member.isfile()}
              if names != expected:
                  raise SystemExit(f'unexpected archive paths: missing={sorted(expected - names)} extra={sorted(names - expected)}')
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f'unsafe archive member: {member.name}')
              source.extractall('.', filter='data')
          PY
      - name: Verify reviewed P08B source before publication
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/lab scripts/test-client scripts/assert-p08a-evidence scripts/assert-p08b-evidence scripts/scan-secrets
          npm ci --ignore-scripts --prefix frontend --no-audit --no-fund
          npm --prefix frontend run verify
          python3 -m py_compile scripts/lab scripts/assert-p08a-evidence scripts/assert-p08b-evidence scripts/scan-secrets
          python3 - <<'PY'
          import json, pathlib
          for name in (
              'backend/src/main/resources/openapi/p08b-ui.json',
              'docs/implementation/P08B_REQUIREMENTS.json',
              'frontend/package.json',
              'frontend/tsconfig.core.json',
          ):
              json.loads(pathlib.Path(name).read_text(encoding='utf-8'))
          PY
          ./mvnw -B -ntp -f backend/pom.xml -DskipTests package
          docker compose --env-file .env.example -f compose.yaml config --quiet
          docker compose --env-file .env.example -f compose.yaml -f compose.p07.yaml config --quiet
          ./scripts/scan-secrets
      - name: Commit reviewed ordinary source
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm --ignore-unmatch .github/workflows/materialize-p08a.yml
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No reviewed source changes found.' >&2; exit 1; }
          git commit -m "feat(p08b): add replay-safe transfer and payment journeys" \
            -m "Add real transfer confirmation and receipts, asynchronous payment history and authoritative polling, preserved same-key uncertainty recovery, pending cancellation, responsive Playwright/axe coverage, scoped contracts and a permanent P08B verification gate."
          candidate_sha="$(git rev-parse HEAD)"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main
      - name: Dispatch exact candidate verification
        shell: bash
        run: |
          set -euo pipefail
          body='{"ref":"main"}'
          for attempt in 1 2 3 4 5; do
            status="$(curl --silent --show-error --output /tmp/dispatch-response --write-out '%{http_code}' \
              --request POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/pr.yml/dispatches" \
              --data "$body")"
            if [[ "$status" == "204" ]]; then
              echo "Dispatched LedgerGuard P08B verification for ${{ steps.publish.outputs.candidate_sha }}"
              exit 0
            fi
            cat /tmp/dispatch-response >&2 || true
            sleep $((attempt * 2))
          done
          echo "Workflow dispatch failed after five attempts." >&2
          exit 1
