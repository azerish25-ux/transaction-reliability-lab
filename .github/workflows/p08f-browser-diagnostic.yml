name: P08F browser diagnostic
on:
  push:
    branches: [main]
    paths: [.github/workflows/p08f-browser-diagnostic.yml]
permissions:
  contents: write
  actions: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply reviewed browser corrections with source hash and concurrent-write guards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess,time
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY'];assert repo=='azerish25-ux/transaction-reliability-lab'
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          changes=[
            ('frontend/src/p08f-ui.tsx','b3bdd25c5c150ee6ce601e6410bfb72039468bac43f30db99aea6750c7b5902b','261044ff52be5296e74aa24ad76e3ef598e469218994615d54adb786cf7e508c',[
              ('>{field.label}{field.options?<select id={`admin-${field.key}`} name={field.key}','><span id={`admin-${field.key}-label`}>{field.label}</span>{field.options?<select id={`admin-${field.key}`} aria-labelledby={`admin-${field.key}-label`} name={field.key}'),
              ('<label htmlFor="admin-limit">Results per page<select id="admin-limit" name="limit"','<label htmlFor="admin-limit"><span id="admin-limit-label">Results per page</span><select id="admin-limit" aria-labelledby="admin-limit-label" name="limit"')]),
            ('frontend/src/p08f.css','2bab05e9ca5fdebf07b7a148218d50cd6a73c2c7c982360795bcfbc554f7b949','a73f83b7ba8ebe994293376984cd1477fcefbf90e9e854b8ce9785cb2f2f1cff',[
              ('.admin-navigation a{','.admin-navigation a{display:inline-flex;align-items:center;min-height:44px;')]),
            ('frontend/tests/e2e/p08f.spec.ts','5398d13708940da730d3bc5003d0834ee59c37044eee78b97e90f2bae42294ff','9e261a8c89cb21af5ccf47caadad187e4a02fd864bf3149c4ac301c67ef49e5c',[
              ("test.use({trace:'off',video:'off',screenshot:'off'});","test.use({trace:'off',video:'off',screenshot:'off',actionTimeout:10_000,navigationTimeout:20_000});"),
              ("await expect(region.getByText('Refund',{exact:true})).toBeVisible();","const refundId=(await refund.json()).id as string;const refundRow=region.getByRole('row').filter({hasText:refundId});await expect(refundRow).toHaveCount(1);await expect(refundRow.getByRole('cell').first()).toHaveText(/^Refund\\s*Sequence \\d+$/);")])]
          names=[]
          for name,before,after,replacements in changes:
              p=Path(name);text=p.read_text();assert hashlib.sha256(text.encode()).hexdigest()==before,name+' changed'
              for old,new in replacements:
                  assert old in text
                  text=text.replace(old,new,1)
              assert hashlib.sha256(text.encode()).hexdigest()==after,name+' unexpected patch result'
              p.write_text(text);names.append(name)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*names],check=True)
          assert set(git('diff','--cached','--name-only').splitlines())==set(names)
          head=os.environ['GITHUB_SHA'];assert git('ls-remote','origin','refs/heads/main').split()[0]==head
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','fix(p08f): restore mobile navigation and accessible filter labels'],check=True)
          out=Path('.evidence/p08f-diagnostic');out.mkdir(parents=True,exist_ok=True)
          candidate=git('rev-parse','HEAD');(out/'source-sha.txt').write_text(candidate+'\n')
          subprocess.run(['git','bundle','create',str(out/'source.bundle'),'HEAD'],check=True)
          for attempt in range(2):
              remote=git('ls-remote','origin','refs/heads/main').split()[0]
              if remote==candidate:break
              assert remote==head,'main advanced; refusing overwrite'
              result=subprocess.run(['git','push','origin','HEAD:main'],text=True,capture_output=True);print(result.stdout,result.stderr)
              if result.returncode==0:break
              if attempt==1 or 'Internal Server Error' not in result.stderr:raise RuntimeError('Push failed; candidate bundle retained')
              time.sleep(5)
          assert git('ls-remote','origin','refs/heads/main').split()[0]==candidate
          # Only retire the redundant full run on this publisher's now-superseded source.
          # The corrected candidate is verified separately by the permanent required gate.
          runs=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs?head_sha={head}&per_page=100']))['workflow_runs']
          for run in runs:
              if run['path']=='.github/workflows/pr.yml' and run['head_sha']==head and run['status'] in ('queued','in_progress'):
                  subprocess.run(['gh','api','--method','POST',f'repos/{repo}/actions/runs/{run["id"]}/cancel'],check=True)
          print('Corrected source pushed:',candidate)
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify locked frontend and browser tooling
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm --prefix frontend run verify
          npm exec --prefix frontend -- playwright install --with-deps chromium
      - name: Start real scoped services
        run: |
          ./scripts/lab up
          docker compose --env-file .ledgerguard/runtime.env -f compose.yaml -f compose.p07.yaml up -d --build --wait api scheduler-a scheduler-b receiver webhook-dispatcher-a webhook-dispatcher-b
          docker compose --env-file .ledgerguard/runtime.env -f compose.yaml -f compose.p07.yaml -f compose.p08c-test.yaml up -d --no-deps --wait api
          docker compose --env-file .ledgerguard/runtime.env -f compose.yaml restart web
      - name: Run all thirty administrator journeys and stop on first failure
        run: |
          set -o pipefail
          mkdir -p .evidence/p08f-diagnostic
          cd frontend
          npx --no-install playwright test p08f.spec.ts --max-failures=1 2>&1 | tee ../.evidence/p08f-diagnostic/browser.log
      - name: Collect diagnostic service logs
        if: always()
        run: |
          mkdir -p .evidence/p08f-diagnostic
          docker compose --env-file .ledgerguard/runtime.env -f compose.yaml -f compose.p07.yaml logs --no-color > .evidence/p08f-diagnostic/services.log 2>&1 || true
      - name: Clean up scoped services
        if: always()
        run: docker compose --env-file .ledgerguard/runtime.env -f compose.yaml -f compose.p07.yaml down --remove-orphans || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p08f-browser-diagnostic-${{ github.sha }}
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
          path: |
            .evidence/
            frontend/playwright-report/
            !.evidence/playwright/results/**/trace.zip
            !frontend/playwright-report/data/*.zip
