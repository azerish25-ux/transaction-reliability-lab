name: Bad Penny ordinary consumer-provider contracts

# Deliberately independent from the restricted fault campaign. This supplemental
# workflow cannot satisfy or replace the existing P08F/P09A required gates.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACT_DO_NOT_TRACK: 'true'
      pact_do_not_track: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check shipped frontend and generate genuine consumer contracts
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run verify
          npm --prefix frontend run test:pact
          npm --prefix frontend run test:pact:sensitivity
      - name: Verify contracts against ordinary Spring API and PostgreSQL
        run: ./mvnw -B -ntp -f backend/pom.xml -Pcontracts -Dit.test=PactProviderIT verify
      - name: Retain source-bound contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bad-penny-contracts-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: |
            .evidence/pact/
            .evidence/pact-sensitivity/
            backend/target/failsafe-reports/
            backend/target/surefire-reports/
            backend/target/pact-evidence/
