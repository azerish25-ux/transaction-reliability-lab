name: Trigger P05 integration

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch one integration run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          active="$(gh run list --workflow scheduled-p05.yml --limit 20 --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending")] | length')"
          if [ "$active" = "0" ]; then
            gh workflow run scheduled-p05.yml --ref main
            echo "Dispatched scheduled-p05.yml on main"
          else
            echo "P05 integration already active; no duplicate dispatch"
          fi
