name: P08E verified evidence handoff

on:
  workflow_run:
    workflows: [LedgerGuard P08E verification]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  evidence:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
      - name: Verify completed evidence and retain an exact-source report
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RUN: ${{ github.event.workflow_run.id }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, re, subprocess, zipfile
          from pathlib import Path
          import xml.etree.ElementTree as ET
          repo=os.environ['GITHUB_REPOSITORY']; run_id=int(os.environ['VERIFIED_RUN']); sha=os.environ['VERIFIED_SHA']
          assert repo=='azerish25-ux/transaction-reliability-lab' and re.fullmatch(r'[0-9a-f]{40}',sha)
          def gh(path): return json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/{path}']))
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          run=gh(f'actions/runs/{run_id}')
          assert run['head_sha']==sha and run['head_branch']=='main' and run['event']=='push'
          assert run['path']=='.github/workflows/pr.yml' and run['name']=='LedgerGuard P08E verification'
          assert run['status']=='completed' and run['conclusion']=='success'
          jobs=gh(f'actions/runs/{run_id}/jobs?per_page=100')['jobs']
          assert jobs and all(j['conclusion']=='success' for j in jobs)
          assert any(j['name']=='Required P08E gate' for j in jobs)
          assert git('merge-base',sha,'HEAD')==sha
          allowed=lambda p:p=='README.md' or p.startswith('docs/') or p=='.github/workflows/p08e-evidence-handoff.yml'
          assert all(allowed(p) for p in git('diff','--name-only',sha,'HEAD').splitlines()),'Production source advanced'
          head=git('rev-parse','HEAD')
          artifacts=gh(f'actions/runs/{run_id}/artifacts?per_page=100')['artifacts']
          matches=[a for a in artifacts if a['name']==f'ledgerguard-p08e-evidence-{sha}']
          assert len(matches)==1 and not matches[0]['expired']
          artifact=matches[0]; assert artifact['workflow_run']['head_sha']==sha
          data=subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts/{artifact["id"]}/zip'])
          digest=hashlib.sha256(data).hexdigest()
          assert artifact['digest']=='sha256:'+digest and len(data)==artifact['size_in_bytes']
          z=zipfile.ZipFile(io.BytesIO(data))
          assert all(not n.startswith('/') and '..' not in Path(n).parts for n in z.namelist())
          assert sum(i.file_size for i in z.infolist())<300_000_000
          report=json.loads(z.read('.evidence/p08e/test-summary.json'))
          assert report['status']=='VERIFIED_PASS' and report['sourceSha']==sha and report['trackedTreeDirty'] is False
          assert report['fullProductStatus']=='INCOMPLETE_NO_GO' and report['p08eBrowserCases']==30
          assert len(report['requirements'])==7 and all(r['status']=='VERIFIED_PASS' for r in report['requirements'])
          def aggregate(names):
              assert names
              totals=dict(tests=0,failures=0,errors=0,skipped=0)
              for name in names:
                  root=ET.fromstring(z.read(name)); suites=[root] if root.tag=='testsuite' else list(root.iter('testsuite'))
                  cases=list(root.iter('testcase'))
                  assert len(cases)==sum(int(s.get('tests',0)) for s in suites)
                  assert not any(any(c.find(t) is not None for t in ('failure','error','skipped')) for c in cases)
                  for k in totals: totals[k]+=sum(int(s.get(k,0)) for s in suites)
              assert totals['tests'] and not any(totals[k] for k in ('failures','errors','skipped'))
              return totals
          def junit(folder): return aggregate([n for n in z.namelist() if n.startswith(folder) and n.endswith('.xml') and Path(n).name.startswith('TEST-')])
          counts={'JUnit unit':junit('backend/target/surefire-reports/'),'PostgreSQL/HTTP integration':junit('backend/target/failsafe-reports/'),
              'TypeScript client':aggregate([n for n in z.namelist() if n.startswith('.evidence/client/') and n.endswith('.xml')]),
              'Browser':aggregate(['.evidence/playwright/junit.xml'])}
          assert counts['Browser']['tests']>=114
          stem='p08e-'+sha[:7]; folder=Path('docs/evidence')/stem; folder.mkdir(parents=True,exist_ok=True)
          selected={'chromium-desktop-p08e-subscriptions.png','chromium-desktop-p08e-delivery.png','chromium-tablet-p08e-subscription.png','chromium-mobile-p08e-recovery.png'}
          assert len(report['screenshots'])==12
          for screenshot in report['screenshots']:
              image=z.read(screenshot['path']); assert hashlib.sha256(image).hexdigest()==screenshot['sha256']
              if Path(screenshot['path']).name in selected: (folder/Path(screenshot['path']).name).write_bytes(image)
          assert len(list(folder.glob('*.png')))==4
          (folder/'requirements-matrix.md').write_bytes(z.read('.evidence/p08e/requirements-matrix.md'))
          provenance={'sourceSha':sha,'workflowRunId':run_id,'workflowUrl':run['html_url'],'workflowConclusion':'success','runAttempt':run['run_attempt'],
              'jobs':[{k:j[k] for k in ('id','name','conclusion','html_url')} for j in jobs],
              'artifact':{k:artifact[k] for k in ('id','name','digest','size_in_bytes','created_at','expires_at')},
              'downloadSha256':digest,'downloadDigestVerified':True,'suiteTotals':counts,'report':report,
              'limitations':['Full product remains INCOMPLETE / NO_GO.','Raw artifacts have finite retention.','Tested source differs from later evidence-documentation commits.','Secret-handling journeys disable automatic recordings; manual screenshots exclude secret displays.']}
          Path(f'docs/evidence/{stem}.json').write_text(json.dumps(provenance,indent=2)+'\n')
          rows='\n'.join(f'| {name} | {c["tests"]} | {c["failures"]} | {c["errors"]} | {c["skipped"]} |' for name,c in counts.items())
          evidence=f'''# P08E customer webhooks — VERIFIED_PASS

          Synthetic money only. Overall product: **INCOMPLETE / NO_GO**.

          ## Exact-source verification

          Tested implementation: `{sha}`. Permanent workflow [run {run_id}]({run['html_url']}), attempt {run['run_attempt']}: **SUCCESS**, including **Required P08E gate**. Tracked source was clean and functional browser retries were zero. This report records the tested implementation separately from later documentation commits.

          ## Executed results

          | Suite | Tests | Failures | Errors | Skipped |
          |---|---:|---:|---:|---:|
          {rows}

          P08E adds 28 production-client cases, eight JUnit command-validation cases, and 30 responsive browser cases (ten named scenarios at three viewports). Seven requirements map to executed tests. Twelve P08E screenshots passed the gate and their hashes were checked during handoff. Counts above came from generated XML, not inferred minimums. The full P01–P08D campaign, live service checks and final independent reconciliation passed.

          ## Delivered behavior

          Customer-owned approved subscriptions, versioned enable/disable and secret rotation, owner-scoped delivery and immutable attempt inspection, bounded refresh and audited retry. Protected command receipts retain the original owner, command identity, normalized request and applied version/cycle in one PostgreSQL transaction. Committed-response-loss recovery survives reload and reauthentication without a second rotation or another retry cycle. Replays and ordinary reads never redisclose a signing secret.

          One-time secret display is transient. Losing its response requires resolving the original command and then deliberately requesting a new rotation if a usable secret is needed. Notifications remain separate from payment settlement; real SQL/browser tests prove retry behavior does not change settled money. Legacy P07B compatibility and financial paths remain intact.

          ## Verification corrections

          Strict browser TypeScript checks found two unchecked fixture array indexes; explicit guards corrected them. Additive V11 exposed an old ten-migration assumption. Integration and live-smoke checks now explicitly require all original ten migrations plus V11. No secret, ownership, delivery or accounting assertion was removed. The run retains its raw test diagnostics and scope.

          ## Durable responsive evidence

          These unmodified images came from the successful run and matched its recorded hashes. They show synthetic fixtures without a signing-secret display.

          ![Desktop subscriptions]({stem}/chromium-desktop-p08e-subscriptions.png)
          ![Desktop delivery]({stem}/chromium-desktop-p08e-delivery.png)
          ![Tablet controls]({stem}/chromium-tablet-p08e-subscription.png)
          ![Mobile recovery]({stem}/chromium-mobile-p08e-recovery.png)

          ## Provenance and limitations

          Artifact `{artifact['id']}`: `{artifact['name']}`; {artifact['size_in_bytes']} bytes. GitHub digest: `{artifact['digest']}`. The downloaded ZIP matched that digest. Reported expiry: `{artifact['expires_at']}`. [JSON provenance]({stem}.json) and [requirement matrix]({stem}/requirements-matrix.md) retain source and artifact metadata.

          This is a verified development milestone, not full completion or production-financial readiness. Broader administrator interfaces remain before P09. P09–P11, final performance/security/restore campaigns and final release evidence remain open. A source secret scan is not comprehensive security assurance.
          '''
          Path(f'docs/evidence/{stem}.md').write_text(evidence)
          totals=', '.join(f'{c["tests"]} {name}' for name,c in counts.items())
          progress=Path('docs/implementation/PROGRESS.md'); original=progress.read_text()
          history=original[original.index('## Preserved P08D checkpoint'):]
          progress.write_text(f'''# P08E customer webhook interface — VERIFIED_PASS

          Overall product remains **INCOMPLETE / NO_GO**. P01–P08E retain exact-source verification; broader administrator interfaces and P09–P11 remain incomplete.

          ## Exact-source checkpoint

          Implementation `{sha}` passed permanent **LedgerGuard P08E verification** run `{run_id}`, including **Required P08E gate**. Tracked source was clean, required failures/errors/skips were zero, and functional browser retries were zero.

          Executed totals: {totals}. Seven P08E requirements and twelve responsive screenshots passed. Durable evidence: [report](../evidence/{stem}.md), [provenance](../evidence/{stem}.json).

          ## Delivered P08E scope

          Approved customer subscriptions, version-aware enable/disable and rotation, transient one-time secret disclosure, owner-scoped delivery/attempt history, bounded polling and audited retry. Atomic command receipts prevent lost-response recovery from rotating again or opening another retry cycle. Original non-secret command metadata survives reload and reauthentication. Real responsive browser/SQL oracles verify ownership, concurrency, receipt immutability and financial isolation. Legacy P07B and the full earlier campaign remain preserved.

          The documented P07 overlay activates V11 and the signed receiver/dispatchers. See `P08E_REQUIREMENTS.json`, ADR 0022 and `/api/v1/openapi/p08e-ui.json`.

          ## Next executable action

          Complete broader administrator transaction search, ledger detail, audit history and reconciliation interfaces. Preserve P01–P08E, execute real authorization and responsive browser journeys, and retain a successful permanent gate against the exact final source SHA. Do not begin P09 until the remaining P08 interfaces are verified. No individual milestone completes the whole product.

          '''+history)
          readme=Path('README.md'); s=readme.read_text()
          s=re.sub(r'\*\*Synthetic money only\..*?\*\*','**Synthetic money only. P01–P08E are exact-SHA verified development milestones. P08E adds customer webhook management, protected one-time secret handling, delivery/attempt inspection and replay-safe command recovery. Broader administrator interfaces, the complete fault laboratory, later test lanes and final release evidence remain incomplete. Overall status: INCOMPLETE / NO_GO.**',s,count=1)
          s=s.replace('## Current verification status','## Historical P08D verification status',1)
          section=f'''## P08E customer webhooks — VERIFIED_PASS

          With the documented P07 overlay active, use **Webhooks** in customer navigation. Manage the approved sandbox subscription, enable/disable it, deliberately rotate its signing secret, inspect deliveries and attempts, and request eligible audited retries. Notification failure never changes settled payment results.

          Lost responses retain the original owner-scoped command ID and reviewed version/cycle. Check the outcome or explicitly retry the same command. A first-only secret response is not recoverable through replay: resolve the original command before deliberately rotating again. Secrets are not placed in browser persistence or ordinary reads.

          Implementation `{sha}` passed permanent run `{run_id}`, including **Required P08E gate**. Executed totals: {totals}; zero required failures/errors/skips and zero functional browser retries. Seven new requirements and twelve screenshots passed with P01–P08D preserved. See [evidence](docs/evidence/{stem}.md), [provenance](docs/evidence/{stem}.json), `docs/implementation/P08E_REQUIREMENTS.json`, and `/api/v1/openapi/p08e-ui.json`.

          '''
          s=s.replace('## Historical P08D verification status',section+'## Historical P08D verification status',1)
          s=s.replace('Next: customer webhook subscription/delivery interfaces, then broader administrator interfaces. These remain P08 work before P09.','Next: broader administrator transaction/ledger/audit/reconciliation interfaces. These remain P08 work before P09.')
          s=s.replace('Customer webhook and broader administrator interfaces remain later P08 slices.','Customer webhook interfaces are verified in P08E below; broader administrator interfaces remain later P08 work.')
          readme.write_text(s)
          index=Path('docs/evidence/INDEX.md'); first,_,rest=index.read_text().partition('\n')
          index.write_text(first+f'\n\n## Latest verified milestone: P08E\n\nImplementation `{sha}`, successful permanent run `{run_id}`. [Report]({stem}.md), [JSON provenance]({stem}.json), [requirements]({stem}/requirements-matrix.md). Overall product remains INCOMPLETE / NO_GO. Earlier entries retain their historical scope.\n\n'+rest)
          delivery=Path('docs/implementation/DELIVERY.md')
          delivery.write_text(delivery.read_text()+f'\n\n## P08E exact-source delivery\n\nImplementation `{sha}` passed permanent run `{run_id}` and Required P08E gate. Later evidence-documentation commits are separate from the tested source. See [report](../evidence/{stem}.md) and [provenance](../evidence/{stem}.json). Full product remains INCOMPLETE / NO_GO. Broader administrator interfaces are next.\n')
          readiness=Path('docs/implementation/RELEASE_READINESS.md'); s=readiness.read_text()
          s=s.replace('P01–P08D','P01–P08E').replace('P08A–P08D','P08A–P08E').replace('through P08D','through P08E')
          s=s.replace('Customer webhook and broader administrator interfaces','Broader administrator interfaces')
          s=s.replace('Customer webhook and broader administrator browser workflows remain incomplete.','Customer webhooks are verified; broader administrator browser workflows remain incomplete.')
          s=s.replace('Additive migrations through V10','Additive migrations through V11')
          s=re.sub(r'Latest evidence:.*',f'Latest evidence: `{sha}`, permanent run `{run_id}`; [P08E report](../evidence/{stem}.md). Full-product gates are not upgraded merely because this milestone passed.',s,count=1)
          readiness.write_text(s)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','README.md','docs/evidence','docs/implementation/PROGRESS.md','docs/implementation/DELIVERY.md','docs/implementation/RELEASE_READINESS.md'],check=True)
          assert all(p=='README.md' or p.startswith('docs/') for p in git('diff','--cached','--name-only').splitlines())
          assert git('ls-remote','origin','refs/heads/main').split()[0]==head,'main advanced; refusing to overwrite concurrent work'
          subprocess.run(['git','commit','-m','docs(p08e): retain exact-SHA verification and responsive evidence [skip ci]'],check=True)
          subprocess.run(['git','push','origin','HEAD:main'],check=True)
          print(json.dumps({'testedSource':sha,'documentationCommit':git('rev-parse','HEAD'),'counts':counts,'artifactId':artifact['id'],'digest':artifact['digest']},indent=2))
          PY
