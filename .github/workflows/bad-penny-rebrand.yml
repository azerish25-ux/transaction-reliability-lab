name: Bad Penny documentation rename

on:
  push:
    branches: [main]
    paths: ['.github/workflows/bad-penny-rebrand.yml']

permissions:
  contents: write

jobs:
  inspect:
    if: github.repository_id == '1388407800'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the requested repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Attempt only the user-requested repository rename
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path
          url = 'https://api.github.com/repos/azerish25-ux/transaction-reliability-lab'
          headers = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          result = {'requestedName': 'bad-penny', 'repositoryId': 1388407800, 'renamed': False}
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=20) as response:
                  before = json.load(response)
              assert before['id'] == 1388407800 and before['owner']['login'] == 'azerish25-ux'
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers, data=json.dumps({'name': 'bad-penny'}).encode(), method='PATCH'), timeout=20) as response:
                  after = json.load(response)
              assert after['id'] == 1388407800 and after['full_name'] == 'azerish25-ux/bad-penny'
              result.update(renamed=True, fullName=after['full_name'], url=after['html_url'])
          except urllib.error.HTTPError as error:
              result.update(httpStatus=error.code, reason=json.loads(error.read()).get('message', 'GitHub rejected repository settings update'))
          except Exception as error:
              result.update(reason=type(error).__name__)
          output = Path(os.environ['RUNNER_TEMP']) / 'bad-penny-repository-rename.json'
          output.write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          PY
      - name: Export immutable tracked source for documentation review
        run: git archive --format=zip --output="$RUNNER_TEMP/bad-penny-source.zip" HEAD
      - name: Publish source and exact rename result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bad-penny-rebrand-source-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/bad-penny-source.zip
            ${{ runner.temp }}/bad-penny-repository-rename.json
