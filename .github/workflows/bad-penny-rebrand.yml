name: Bad Penny documentation rename
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bad-penny-rebrand.yml']
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    if: github.repository_id == '1388407800'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify reviewed documentation and stage content blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, io, json, os, subprocess, urllib.request, zipfile
          repo = os.environ['GITHUB_REPOSITORY']
          assert os.environ['GITHUB_REPOSITORY_ID'] == '1388407800'
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert base == os.environ['GITHUB_SHA']
          out = Path(os.environ['RUNNER_TEMP']) / 'bad-penny-rebrand'
          out.mkdir()
          package = out / 'reviewed.zip'
          with package.open('wb') as target:
              subprocess.run(['gh', 'api', f'repos/{repo}/actions/artifacts/11043051711/zip'], stdout=target, check=True)
          def sha(data): return hashlib.sha256(data).hexdigest()
          assert sha(package.read_bytes()) == 'efc5e94d698eb3499dd7a862954776f3b1de027a7d054865319a92d523c76119'
          with zipfile.ZipFile(package) as archive:
              plan = json.loads(archive.read('plan.json'))
              updated = archive.read('updated-files.zip')
          changes = plan['changedFiles']
          expected = {item['path']: item['afterSha256'] for item in changes}
          assert sha(json.dumps(expected, sort_keys=True, separators=(',', ':')).encode()) == 'fb82fefaf1efda73a4dc3aedb9d1333ba86c58da66faf606716ae8baa3ca64e4'
          temporary = '.github/workflows/bad-penny-rebrand.yml'
          with zipfile.ZipFile(io.BytesIO(updated)) as archive:
              assert set(archive.namelist()) == {name for name, value in expected.items() if value is not None}
              for item in changes:
                  name = item['path']
                  path = Path(name)
                  assert not path.is_absolute() and '..' not in path.parts and not path.is_symlink()
                  if name == temporary:
                      assert item['afterSha256'] is None
                      path.unlink()
                      continue
                  assert sha(path.read_bytes()) == item['beforeSha256'], ('source changed', name)
                  data = archive.read(name)
                  assert sha(data) == item['afterSha256']
                  path.write_bytes(data)
          subprocess.run(['git', 'diff', '--check'], check=True)
          with (out / 'component-tests.log').open('w') as log:
              subprocess.run(['python3', '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_p09a*.py', '-v'], stdout=log, stderr=subprocess.STDOUT, check=True)
          assert 'Ran 228 tests' in (out / 'component-tests.log').read_text()
          entries = []
          for item in changes:
              name = item['path']
              entry = {'path': name, 'mode': '100644', 'type': 'blob'}
              if item['afterSha256'] is None:
                  entry['sha'] = None
              else:
                  data = Path(name).read_bytes()
                  wanted = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                  payload = json.dumps({'content': data.decode('utf-8'), 'encoding': 'utf-8'}).encode()
                  request = urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs', data=payload, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      actual = json.load(response)['sha']
                  assert actual == wanted, ('blob mismatch', name)
                  entry['sha'] = actual
              entries.append(entry)
          receipt = {'base': base, 'baseTree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), 'repository': repo, 'treeElements': entries, 'refUpdated': False, 'componentTestsPassed': 228}
          (out / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          (out / 'plan.json').write_text(json.dumps(plan, indent=2) + '\n')
          print(json.dumps(receipt))
          PY
      - name: Publish receipt and tests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bad-penny-staged-blobs-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/bad-penny-rebrand/receipt.json
            ${{ runner.temp }}/bad-penny-rebrand/plan.json
            ${{ runner.temp }}/bad-penny-rebrand/component-tests.log
