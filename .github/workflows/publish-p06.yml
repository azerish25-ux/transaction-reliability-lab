name: Publish staged P06 source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: "${{ github.event.head_commit.message == 'chore: stage P06 source publication' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out staging commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Verify and unpack reviewed source
        run: |
          cat .p06-source.part-* | base64 --decode > /tmp/p06-source.tar.gz
          echo '406f4b376c25132e14f8ee2feb492f94a3763421e3685b0964da4bb2acd42fc8  /tmp/p06-source.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/p06-source.tar.gz
          rm .p06-source.part-*
          chmod +x scripts/lab scripts/test-client scripts/smoke-adjustments scripts/assert-p06-evidence
      - name: Commit and publish P06 implementation
        run: |
          git config user.name 'azerish25-ux'
          git config user.email 'azerish25@gmail.com'
          git add -A
          git commit -m 'feat: implement P06 payment adjustment reliability'
          git push origin HEAD:main
