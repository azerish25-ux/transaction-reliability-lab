name: P08C admission boundary proof correction
on:
  push:
    branches: [main]
    paths: [.github/workflows/p08c-admission-proof.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Correct the proven admission-order assertion without weakening financial oracles
        run: |
          set -euo pipefail
          git diff --exit-code 1efe60c0ca8a8216a67091788ad11d478afb2fa4 HEAD -- . ':(exclude).github/workflows/p08c-admission-proof.yml'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('frontend/tests/e2e/p08c.spec.ts'); text=p.read_text()
          assert hashlib.sha256(text.encode()).hexdigest()=='e0607b25191faef975c1d7d9dbaef53bc07b67255220c099b0bc7774039ee438'
          old="""  const denied = page.waitForResponse(r => r.request().method() === 'POST' && r.url().endsWith(`/payments/${f.payment.id}/refunds`) && r.status() === 401, { timeout: 15_000 });
            await page.getByRole('button', { name: 'Retry same refund' }).click({ timeout: 10_000 });
            expect((await denied).status()).toBe(401);"""
          new="""  // Logout also invalidates CSRF: the stale protected POST is rejected at the CSRF
            // boundary first; the subsequent authoritative read proves session invalidation.
            const denied = page.waitForResponse(r => r.request().method() === 'POST' && r.url().endsWith(`/payments/${f.payment.id}/refunds`), { timeout: 15_000 });
            const expiredRead = page.waitForResponse(r => r.request().method() === 'GET' && r.url().endsWith(`/payments/${f.payment.id}/adjustment-context`) && r.status() === 401, { timeout: 15_000 });
            await page.getByRole('button', { name: 'Retry same refund' }).click({ timeout: 10_000 });
            const admission = await denied;
            expect(admission.status()).toBe(403); expect((await admission.json()).code).toBe('CSRF_INVALID');
            expect((await expiredRead).status()).toBe(401);"""
          assert text.count(old)==1
          text=text.replace(old,new)
          assert hashlib.sha256(text.encode()).hexdigest()=='1518e38dc77d575218f1550fa65690fd256a638ea676bdbf37ed89fa33920465'
          p.write_text(text)
          PY
          git diff --check
      - name: Verify application and client contracts
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm --prefix frontend run verify
      - name: Commit and fast-forward corrected test
        run: |
          set -euo pipefail
          git add frontend/tests/e2e/p08c.spec.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(p08c): prove CSRF denial before revoked-session recovery' -m 'Assert the actual stale POST 403 CSRF_INVALID followed by authoritative GET 401 after logout. Preserve reauthentication, the original key, replayed receipt and independent one-adjustment ledger assertions.'
          git push origin HEAD:main
          echo "Corrected source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
