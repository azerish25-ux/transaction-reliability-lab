name: P05 source export

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Package reviewed source
        run: tar --exclude=.git -czf /tmp/ledgerguard-source.tgz .
      - name: Upload source package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ledgerguard-source-${{ github.sha }}
          path: /tmp/ledgerguard-source.tgz
          retention-days: 1
          if-no-files-found: error
