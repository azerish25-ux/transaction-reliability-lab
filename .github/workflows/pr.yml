name: LedgerGuard P08B verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, customer money movement, browser accessibility, signed webhooks and financial invariants
    runs-on: ubuntu-latest
    timeout-minutes: 165
    steps:
      - name: Check out candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Configure Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Configure Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare deterministic tools
        run: chmod +x mvnw scripts/lab scripts/test-core scripts/test-client scripts/assert-p04-evidence scripts/assert-p05-evidence scripts/assert-p06-evidence scripts/assert-p07a-evidence scripts/assert-p07b-evidence scripts/assert-p08a-evidence scripts/assert-p08b-evidence scripts/smoke-auth scripts/smoke-adjustments scripts/smoke-schedules scripts/smoke-webhooks scripts/unit-probes scripts/validate-evidence scripts/scan-secrets infra/docker/postgres/00-roles.sh
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
      - name: Verify strict frontend source, client contracts and production build
        run: npm --prefix frontend run verify
      - name: Run Java and TypeScript component regressions
        run: ./scripts/lab test unit
      - name: Execute JUnit, PostgreSQL, multi-process HTTP, schedule and webhook verification
        run: ./mvnw -B -ntp -f backend/pom.xml verify
      - name: Validate Compose models
        run: |
          docker compose --env-file .env.example -f compose.yaml config --quiet
          docker compose --env-file .env.example -f compose.yaml -f compose.p07.yaml config --quiet
      - name: Scan tracked source for high-signal literal secrets
        run: ./scripts/scan-secrets
      - name: Install exact Chromium runtime
        run: npm exec --prefix frontend -- playwright install --with-deps chromium
      - name: Start, migrate, seed and reconcile the P08B topology
        run: ./scripts/lab up
      - name: Preserve P05 payment, RabbitMQ, duplicate-delivery and process-death proofs
        run: python3 scripts/smoke-auth
      - name: Preserve P06 cancellation, refund, reversal and adjustment proofs
        run: python3 scripts/smoke-adjustments
      - name: Activate V10, two schedulers, two webhook dispatchers and the signed receiver
        run: |
          docker compose --env-file .ledgerguard/runtime.env -f compose.yaml -f compose.p07.yaml up -d --build --wait api scheduler-a scheduler-b receiver webhook-dispatcher-a webhook-dispatcher-b
      - name: Preserve P07A schedules, duplicate protection and accounting
        run: python3 scripts/smoke-schedules
      - name: Exercise P07B encrypted secrets, signatures, retries, restart and authorization
        run: python3 scripts/smoke-webhooks
      - name: Exercise P08A and P08B customer journeys, uncertainty recovery, responsive UI and axe checks
        run: npm --prefix frontend run test:e2e
      - name: Verify live status and repeatable reconciliation
        run: |
          ./scripts/lab status
          ./scripts/lab reconcile
      - name: Require P01-P08A regression and executed P08B requirements
        run: python3 scripts/assert-p08b-evidence
      - name: Capture service logs
        if: always()
        run: |
          ./scripts/lab logs
          mkdir -p .evidence/compose
          docker compose --env-file .ledgerguard/runtime.env -f compose.yaml -f compose.p07.yaml logs --no-color > .evidence/compose/p08b-services.log 2>&1 || true
      - name: Stop the scoped environment
        if: always()
        run: |
          docker compose --env-file .ledgerguard/runtime.env -f compose.yaml -f compose.p07.yaml down --remove-orphans || true
          ./scripts/lab down || true
      - name: Publish verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ledgerguard-p08b-evidence-${{ github.sha }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          path: |
            .evidence/
            frontend/dist/
            frontend/playwright-report/
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/auth-http-evidence/
            backend/target/transfer-http-evidence/
            backend/target/payment-adjustment-http-evidence/

  gate:
    name: Required P08B gate
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory P08B job
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          echo "verify=$VERIFY_RESULT"
          test "$VERIFY_RESULT" = success
