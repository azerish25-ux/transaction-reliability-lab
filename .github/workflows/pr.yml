name: Bad Penny P08F verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, administrator investigation, browser accessibility and financial invariants
    runs-on: ubuntu-latest
    timeout-minutes: 165
    steps:
      - name: Check out candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Configure Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Configure Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare deterministic tools
        run: chmod +x mvnw scripts/lab scripts/test-core scripts/test-client scripts/assert-p04-evidence scripts/assert-p05-evidence scripts/assert-p06-evidence scripts/assert-p07a-evidence scripts/assert-p07b-evidence scripts/assert-p08a-evidence scripts/assert-p08b-evidence scripts/assert-p08c-evidence scripts/assert-p08d-evidence scripts/assert-p08e-evidence scripts/assert-p08f-evidence scripts/smoke-auth scripts/smoke-adjustments scripts/smoke-schedules scripts/smoke-webhooks scripts/unit-probes scripts/validate-evidence scripts/scan-secrets infra/docker/postgres/00-roles.sh
      - name: Execute the shared CLI and CI P01-P08F campaign
        run: ./scripts/lab test pr
      - name: Collect diagnostic logs after an interrupted job
        if: cancelled()
        run: python3 scripts/verify-product collect
      - name: Stop scoped services after an interrupted job
        if: cancelled()
        run: python3 scripts/verify-product stop
      - name: Publish verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ledgerguard-p08f-evidence-${{ github.sha }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          path: |
            .evidence/
            frontend/dist/
            frontend/playwright-report/
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/auth-http-evidence/
            backend/target/transfer-http-evidence/
            backend/target/payment-adjustment-http-evidence/
            backend/target/admin-http-evidence/
            !.evidence/playwright/results/**/trace.zip
            !frontend/playwright-report/data/*.zip

  gate:
    name: Required P08F gate
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory P08F job
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          echo "verify=$VERIFY_RESULT"
          test "$VERIFY_RESULT" = success

  p09a:
    name: Isolated P09A lab, live faults, defect detection and restoration
    # Independent runners may verify the same candidate concurrently. The required
    # P09A gate below still rejects a failed, skipped or cancelled product campaign.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the same immutable candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Configure Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Configure Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Execute isolated lab verification on the same candidate
        run: python3 lab-support/p09a/cli.py verify-lab
      - name: Ensure scoped lab teardown, including cancelled jobs
        if: always()
        run: python3 lab-support/p09a/cli.py down
      - name: Publish only curated P09A evidence, never runtime secrets or raw traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ledgerguard-p09a-evidence-${{ github.sha }}
          path: .evidence/p09a/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  p09a-gate:
    name: Required P09A gate
    if: always()
    needs: [verify, p09a]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both normal product and isolated laboratory verification
        env:
          PRODUCT_RESULT: ${{ needs.verify.result }}
          LAB_RESULT: ${{ needs.p09a.result }}
        run: |
          test "$PRODUCT_RESULT" = success
          test "$LAB_RESULT" = success
