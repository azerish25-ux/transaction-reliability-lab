name: LedgerGuard P05 verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, payments, messaging recovery, security and financial invariants
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Publish temporary source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ledgerguard-p05-source-${{ github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1
          path: |
            .
            !.git/**
            !.ledgerguard/**
            !.evidence/**
            !backend/target/**
            !frontend/node_modules/**
      - name: Configure Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Configure Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare deterministic tools
        run: chmod +x mvnw scripts/lab scripts/test-core scripts/test-client scripts/assert-p04-evidence scripts/assert-p05-evidence scripts/smoke-auth scripts/unit-probes scripts/validate-evidence scripts/scan-secrets infra/docker/postgres/00-roles.sh
      - name: Install locked TypeScript dependency
        run: npm ci --prefix frontend
      - name: Run Java and TypeScript component regressions
        run: ./scripts/lab test unit
      - name: Execute JUnit, PostgreSQL and two-process HTTP verification
        run: ./mvnw -B -ntp -f backend/pom.xml verify
      - name: Validate Compose model
        run: docker compose --env-file .env.example -f compose.yaml config --quiet
      - name: Scan tracked source for high-signal literal secrets
        run: ./scripts/scan-secrets
      - name: Start, migrate, seed and reconcile the complete P05 topology
        run: ./scripts/lab up
      - name: Exercise real payments, RabbitMQ, duplicate delivery and process-death recovery
        run: python3 scripts/smoke-auth
      - name: Verify live status and repeatable reconciliation
        run: |
          ./scripts/lab status
          ./scripts/lab reconcile
      - name: Require executed P03/P04/P05 requirements with no failures or skips
        run: python3 scripts/assert-p05-evidence
      - name: Capture service logs
        if: always()
        run: ./scripts/lab logs
      - name: Stop the scoped environment
        if: always()
        run: ./scripts/lab down
      - name: Publish verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ledgerguard-p05-evidence-${{ github.sha }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
          path: |
            .evidence/
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
            backend/target/auth-http-evidence/
            backend/target/transfer-http-evidence/
  gate:
    name: Required P05 gate
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory P05 job
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          echo "verify=$VERIFY_RESULT"
          test "$VERIFY_RESULT" = success
