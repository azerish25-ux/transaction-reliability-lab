name: LedgerGuard fast verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build, financial core, database and Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Configure Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Configure Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare deterministic tools
        run: chmod +x mvnw scripts/lab scripts/test-core scripts/test-client scripts/unit-probes scripts/validate-evidence scripts/scan-secrets infra/docker/postgres/00-roles.sh

      - name: Install locked TypeScript dependency
        run: npm ci --prefix frontend

      - name: Run existing Java and TypeScript component suites
        run: ./scripts/lab test unit

      - name: Execute JUnit and real PostgreSQL Testcontainers verification
        run: ./mvnw -B -ntp -f backend/pom.xml verify

      - name: Validate Compose model
        run: docker compose --env-file .env.example -f compose.yaml config --quiet

      - name: Scan tracked source for high-signal literal secrets
        run: ./scripts/scan-secrets

      - name: Start, seed and reconcile the restricted-role foundation
        run: ./scripts/lab up

      - name: Verify live status and repeatable reconciliation
        run: |
          ./scripts/lab status
          ./scripts/lab reconcile

      - name: Capture service logs
        if: always()
        run: ./scripts/lab logs

      - name: Stop the scoped environment
        if: always()
        run: ./scripts/lab down

      - name: Publish verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ledgerguard-fast-evidence-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            .evidence/
            backend/target/surefire-reports/
            backend/target/failsafe-reports/

  gate:
    name: Required fast-lane gate
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory fast-lane job
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          echo "verify=$VERIFY_RESULT"
          test "$VERIFY_RESULT" = success
