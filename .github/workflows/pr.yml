name: LedgerGuard P07A publisher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ledgerguard-p07a-publisher
  cancel-in-progress: false

jobs:
  publish-reviewed-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Materialize reviewed P07A candidate
        shell: bash
        run: |
          set -euo pipefail
          if test -f backend/src/main/java/lab/ledgerguard/schedules/ScheduleService.java; then
            echo "P07A candidate already materialized."
            exit 0
          fi
          cat .p07a-payload/*.part | tr -d '\n' | base64 --decode > /tmp/p07a.tar.xz
          echo "d41bf55a42196022316da040bc0e5f61044a6f0418e7cd3f172ed13876ae5407  /tmp/p07a.tar.xz" | sha256sum -c -
          tar -xJf /tmp/p07a.tar.xz -C .
          rm -rf .p07a-payload
          git config user.name "azerish25-ux"
          git config user.email "azerish25@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add durable P07A scheduled transfers"
          git push origin HEAD:main
