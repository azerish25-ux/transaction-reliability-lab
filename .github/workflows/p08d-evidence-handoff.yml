name: P08D verified evidence handoff
on:
  workflow_run:
    workflows: [LedgerGuard P08D verification]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: github.event.workflow_run.id == 36464316280 && github.event.workflow_run.head_sha == '13bdd62c924a3230825b6d9304f449f887c8e7fe' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require unchanged implementation and permanent gate
        run: |
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git','diff','--name-only','13bdd62c924a3230825b6d9304f449f887c8e7fe','HEAD'],text=True).splitlines()
          allowed = lambda p: p.startswith('docs/') or p == 'README.md' or p == '.github/workflows/p08d-evidence-handoff.yml'
          if not all(allowed(p) for p in paths):
              raise SystemExit('Implementation changed after the verified candidate; refusing stale evidence publication')
          PY
      - name: Validate artifact provenance and retain compact evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, urllib.error, urllib.parse, urllib.request, zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path
          REPO = 'azerish25-ux/transaction-reliability-lab'
          SOURCE = '13bdd62c924a3230825b6d9304f449f887c8e7fe'
          RUN = 36464316280
          PREFIX = 'https://api.github.com/repos/' + REPO
          HEADERS = {'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'LedgerGuard-evidence-handoff'}
          def require(condition, message):
              if not condition: raise SystemExit(message)
          def api(path):
              with urllib.request.urlopen(urllib.request.Request(PREFIX + path, headers=HEADERS), timeout=60) as response:
                  return json.load(response)
          run = api(f'/actions/runs/{RUN}')
          require(run['head_sha'] == SOURCE and run['status'] == 'completed' and run['conclusion'] == 'success', 'Exact-source permanent campaign has not passed')
          require(run['path'] == '.github/workflows/pr.yml', 'Not the permanent verification workflow')
          jobs = api(f'/actions/runs/{RUN}/jobs?per_page=100')['jobs']
          require(len(jobs) == 2 and all(j['conclusion'] == 'success' for j in jobs), 'Required jobs did not both pass')
          require(any(j['name'] == 'Required P08D gate' for j in jobs), 'Required P08D gate missing')
          artifacts = [a for a in api(f'/actions/runs/{RUN}/artifacts?per_page=100')['artifacts'] if a['name'] == 'ledgerguard-p08d-evidence-' + SOURCE]
          require(len(artifacts) == 1, 'Expected one exact-source artifact')
          artifact = artifacts[0]
          require(not artifact['expired'] and artifact['workflow_run']['head_sha'] == SOURCE, 'Artifact expired or source differs')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          request = urllib.request.Request(PREFIX + f"/actions/artifacts/{artifact['id']}/zip", headers=HEADERS)
          try:
              with urllib.request.build_opener(NoRedirect).open(request, timeout=60) as response: payload = response.read(100_000_001)
          except urllib.error.HTTPError as error:
              require(error.code in (301,302,303,307,308), 'Artifact download failed')
              location = error.headers['Location']
              parsed = urllib.parse.urlsplit(location)
              require(parsed.scheme == 'https' and parsed.hostname and (parsed.hostname.endswith('.blob.core.windows.net') or parsed.hostname.endswith('.githubusercontent.com')), 'Unexpected artifact storage host')
              # Do not forward the GitHub credential to the signed storage URL.
              with urllib.request.urlopen(urllib.request.Request(location, headers={'User-Agent':'LedgerGuard-evidence-handoff'}), timeout=60) as response: payload = response.read(100_000_001)
          require(len(payload) <= 100_000_000, 'Artifact exceeds scoped download budget')
          digest = hashlib.sha256(payload).hexdigest()
          require(artifact['digest'] == 'sha256:' + digest, 'Downloaded ZIP digest differs from GitHub')
          archive = zipfile.ZipFile(io.BytesIO(payload))
          def member(suffix):
              matches = [n for n in archive.namelist() if n == suffix or n.endswith('/' + suffix)]
              require(len(matches) == 1, 'Missing/ambiguous member: ' + suffix)
              require(archive.getinfo(matches[0]).file_size < 10_000_000, 'Member exceeds budget')
              return archive.read(matches[0])
          summary = json.loads(member('.evidence/p08d/test-summary.json'))
          require(summary['status'] == 'VERIFIED_PASS' and summary['sourceSha'] == SOURCE and summary['trackedTreeDirty'] is False, 'Gate report does not prove this clean source')
          require(len(summary['requirements']) == 8 and all(r['status'] == 'VERIFIED_PASS' for r in summary['requirements']), 'Incomplete requirement mapping')
          for name, counts in summary['suites'].items(): require(all(counts[k] == 0 for k in ('failures','errors','skipped')), 'Nonpassing suite: ' + name)
          def xml_totals(segment):
              totals = dict(tests=0, failures=0, errors=0, skipped=0)
              names = [n for n in archive.namelist() if segment in n and n.endswith('.xml')]
              if segment.startswith('backend/'): names = [n for n in names if Path(n).name.startswith('TEST-')]
              require(names, 'Missing XML reports: ' + segment)
              for name in names:
                  root = ET.fromstring(archive.read(name))
                  for suite in ([root] if root.tag == 'testsuite' else list(root.iter('testsuite'))):
                      for key in totals: totals[key] += int(suite.get(key, '0'))
              require(all(totals[k] == 0 for k in ('failures','errors','skipped')), 'Nonpassing original XML reports')
              return totals
          totals = {'junitUnit':xml_totals('backend/target/surefire-reports/'), 'postgresHttpIntegration':xml_totals('backend/target/failsafe-reports/'), 'typescriptClient':xml_totals('.evidence/client/'), 'browser':summary['suites']['all-browser']}
          folder = Path('docs/evidence/p08d-13bdd62'); folder.mkdir(parents=True, exist_ok=True)
          shots = []
          for filename in ('chromium-desktop-p08d-form.png','chromium-desktop-p08d-result.png','chromium-tablet-p08d-controls.png','chromium-mobile-p08d-recovery.png'):
              path = '.evidence/playwright/screenshots/' + filename
              attested = [s for s in summary['screenshots'] if s['path'] == path]
              require(len(attested) == 1, 'Screenshot not attested by gate')
              image = member(path)
              require(image.startswith(b'\x89PNG\r\n\x1a\n') and hashlib.sha256(image).hexdigest() == attested[0]['sha256'], 'Screenshot format/hash differs')
              (folder / filename).write_bytes(image)
              shots.append({'path':str(folder / filename),'sha256':attested[0]['sha256']})
          record = {'phase':'P08D','status':'VERIFIED_PASS','fullProductStatus':'INCOMPLETE_NO_GO','sourceSha':SOURCE,'trackedTreeDirty':False,'verifiedAt':summary['timestamp'],
              'workflow':{'id':RUN,'url':run['html_url'],'path':run['path'],'attempt':run['run_attempt'],'conclusion':run['conclusion'],'completedAt':run['updated_at'],'jobs':[{'id':j['id'],'name':j['name'],'conclusion':j['conclusion']} for j in jobs]},
              'artifact':{k:artifact[k] for k in ('id','name','size_in_bytes','digest','created_at','expires_at','expired')},'downloadedArtifactSha256':digest,
              'executedTotals':totals,'p08dSuites':summary['suites'],'p08dBrowserCases':summary['p08dBrowserCases'],
              'requirements':[{'id':r['id'],'statement':r['statement'],'status':r['status']} for r in summary['requirements']],
              'screenshots':summary['screenshots'],'durableScreenshots':shots,'scope':summary['scope'],
              'limitations':['Historical source-bound evidence, not live financial state.','The Actions artifact has finite retention; the compact report and four attested screenshots remain in git.','The documentation commit is separate from the tested implementation SHA.','Passing the secret scan is not a clean dependency audit or completion of all release/security gates.']}
          Path('docs/evidence/p08d-13bdd62.json').write_text(json.dumps(record,indent=2)+'\n')
          (folder/'requirements-matrix.md').write_bytes(member('.evidence/p08d/requirements-matrix.md'))
          rows = '\n'.join(f"| {name} | {c['tests']} | 0 | 0 | 0 |" for name,c in totals.items())
          job_lines = '\n'.join(f"- `{j['id']}` — {j['name']}: **SUCCESS**." for j in jobs)
          report = f'''# P08D customer schedule management — VERIFIED_PASS

          Synthetic money only. Overall product: **INCOMPLETE / NO_GO**.

          ## Exact-source verification

          - Tested implementation: `{SOURCE}`.
          - Permanent workflow: [run {RUN}]({run['html_url']}), attempt {run['run_attempt']}, **SUCCESS**.
          - Generated gate timestamp: `{summary['timestamp']}`.
          - Tracked source tree: clean. Functional browser retries: zero.
          {job_lines}

          The source SHA above is the tested implementation, not the later evidence-documentation commit.

          ## Executed results

          | Suite | Tests | Failures | Errors | Skipped |
          |---|---:|---:|---:|---:|
          {rows}

          P08D includes {summary['suites']['p08d-client']['tests']} production-client cases, {summary['suites']['p08d-preview-unit']['tests']} server-preview unit cases and {summary['p08dBrowserCases']} browser cases: ten named scenarios at desktop, tablet and mobile sizes. Eight requirements map to executed tests. Twelve P08D screenshots were present and hashed by the gate. Counts were read from this run's generated XML/JSON reports, not inferred from a minimum.

          The permanent campaign retained the earlier financial, authorization, idempotency, payment/outbox, adjustment, schedule and webhook checks. Its final live-status/reconciliation and complete P01-P08D evidence assertion steps succeeded. The run retains their underlying logs and raw evidence.

          ## Delivered behavior

          Owner-scoped schedule lists, creation, version-aware editing, pause/resume/cancel, paged immutable occurrences and real operation/journal references. One-time/daily/weekly recurrence uses explicit local wall time and IANA zone. The server resolves Halifax spring gaps, autumn overlaps and UTC previews without mutation. Funds are checked at occurrence execution, not reserved at creation.

          POST and PUT mutations preserve the original normalized intent, owner, key and expected definition version across response loss, reload and reauthentication. Stale edits are rejected rather than silently rewritten. Historical occurrence times retain their original definition meaning after a zone edit.

          ## Failure found and corrected

          Candidate `cf9fa393781c082c83eb630bb304d61f51048c7a`, run `36452807973`, failed `P08DE2E07` at all three viewport sizes: closing the asynchronous preview did not return focus to **Review schedule**. The form temporarily disabled the invoking control, so capturing `document.activeElement` only when the dialog opened lost the trigger.

          The corrected dialog accepts an explicit stable return-focus ref. Other callers retain automatic restoration. The Escape assertion remains; the regression additionally reopens the dialog using Enter and checks focus restoration after Go back. These assertions passed in the exact-source campaign above. No financial or accessibility assertions were removed.

          ## Durable visual evidence

          These unmodified screenshots came from the successful run and matched its generated screenshot hashes. They depict historical synthetic fixtures, not current customer records.

          ![Desktop schedule form](p08d-13bdd62/chromium-desktop-p08d-form.png)
          ![Desktop occurrence result](p08d-13bdd62/chromium-desktop-p08d-result.png)
          ![Tablet schedule controls](p08d-13bdd62/chromium-tablet-p08d-controls.png)
          ![Mobile preserved-command recovery](p08d-13bdd62/chromium-mobile-p08d-recovery.png)

          ## Artifact provenance and limits

          Artifact `{artifact['id']}`: `{artifact['name']}`; {artifact['size_in_bytes']} bytes. GitHub digest: `{artifact['digest']}`. The downloaded ZIP matched that digest. Reported expiry: `{artifact['expires_at']}`. Raw evidence remains in the finite-retention Actions artifact; the [JSON provenance](p08d-13bdd62.json), [requirement matrix](p08d-13bdd62/requirements-matrix.md) and four screenshots remain in git.

          This is a verified development milestone, not full completion or production financial readiness. Customer webhook and broader administrator interfaces remain before P09. Later test lanes and final release evidence remain open. The secret scan is not a claim that the dependency audit is clean.
          '''
          Path('docs/evidence/p08d-13bdd62.md').write_text(report)
          p = Path('docs/implementation/PROGRESS.md'); progress = p.read_text()
          marker = '# Execution checkpoint — P08C VERIFIED_PASS'
          require(marker in progress, 'Historical checkpoint missing')
          history = progress[progress.index(marker):]
          p.write_text(f'''# P08D customer schedule management — VERIFIED_PASS

          Overall product remains **INCOMPLETE / NO_GO**. Customer webhook and broader administrator interfaces plus P09-P11 remain incomplete.

          ## Exact-source checkpoint

          Implementation `{SOURCE}` passed permanent **LedgerGuard P08D verification** run `{RUN}`. Both the verification job and **Required P08D gate** succeeded. The source tree was clean, required suites had zero failures/errors/skips, and functional browser retries were zero.

          Executed totals: {totals['junitUnit']['tests']} JUnit unit, {totals['postgresHttpIntegration']['tests']} PostgreSQL/HTTP integration, {totals['typescriptClient']['tests']} TypeScript client and {totals['browser']['tests']} browser cases. P08D includes {summary['suites']['p08d-client']['tests']} client cases, {summary['suites']['p08d-preview-unit']['tests']} preview cases and {summary['p08dBrowserCases']} browser cases across three viewports. Eight scoped requirements and twelve P08D screenshots were verified by the gate.

          Exact artifact metadata, the focus regression and durable screenshots are in [the P08D report](../evidence/p08d-13bdd62.md) and [JSON record](../evidence/p08d-13bdd62.json). Evidence is attributed to the tested implementation SHA separately from this documentation commit.

          ## Delivered P08D scope

          - Owner-scoped schedule creation/detail, versioned editing, pause/resume/cancel and paged immutable occurrences.
          - Exact money/recipient validation, execution-time funds semantics and server-authoritative local-time/zone/DST previews.
          - Original-key/body/version POST/PUT recovery through response loss, reload and reauthentication.
          - Explicit stale-state conflict handling and preservation of historical local occurrences after a zone edit.
          - Real browser/SQL financial and ownership oracles, authenticated accessibility and responsive UI evidence.
          - Explicit focus restoration after asynchronous review, including Escape and Go back. P01-P08C checks remain intact.

          ## Next executable action

          Implement the customer webhook subscription/delivery interface against the existing P07B backend: approved endpoint management, protected one-time secret handling, owner-scoped delivery/attempt history, truthful retry/terminal states and authorized manual retry. Preserve P01-P08D and verify real responsive browser/authorization/recovery journeys at the exact source SHA.

          Then complete the broader administrator transaction/ledger/audit/reconciliation interfaces. Do not begin P09 until all remaining P08 interfaces have exact-SHA verification. Do not relabel the full product complete based on P08D alone.

          ## Historical checkpoints

          The following P08C/P08B records preserve their original implementation SHAs and counts. Their former next action is superseded by the current P08D checkpoint above.

          ''' + history)
          p = Path('README.md'); readme = p.read_text()
          replacements = [
              ('P01–P08C are exact-SHA verified development milestones.', 'P01–P08D are exact-SHA verified development milestones.'),
              ('P08D customer schedule management is implemented and awaiting its exact-SHA verification gate.', 'P08D adds verified customer schedule management, server temporal previews and replay-safe lifecycle recovery.'),
              ('## Run the verified P08C topology', '## Run the base topology'),
              ('Schedule, webhook and broader administrator interfaces remain later P08 slices.', 'P08D adds the schedule interface below. Customer webhook and broader administrator interfaces remain later P08 slices.'),
              ('## P08D customer schedule management — IMPLEMENTED_UNVERIFIED', '## P08D customer schedule management — VERIFIED_PASS'),
              ('This section does not claim an executed gate until an exact-SHA evidence record is published.', f'The permanent exact-SHA gate passed for `{SOURCE}` in run `{RUN}`. See [the P08D evidence report](docs/evidence/p08d-13bdd62.md).'),
              ('## Current verification status\n', f"## Current verification status\n\nP08D implementation `{SOURCE}` passed permanent workflow [run {RUN}]({run['html_url']}) on September 28, 2026, including **Required P08D gate**. Executed totals: {totals['junitUnit']['tests']} JUnit unit, {totals['postgresHttpIntegration']['tests']} PostgreSQL/HTTP integration, {totals['typescriptClient']['tests']} TypeScript client and {totals['browser']['tests']} browser cases. Required failures/errors/skips and functional browser retries were zero. Eight P08D requirements, twelve new responsive screenshots and the preserved P01-P08C campaign passed, including final reconciliation. The [durable report](docs/evidence/p08d-13bdd62.md) and [JSON provenance](docs/evidence/p08d-13bdd62.json) retain exact artifact metadata and scope limitations.\n\n### Historical P08C and P08B verification\n"),
              ('Complete the P08D exact-SHA verification before proceeding to customer webhook and broader administrator interfaces. These remain P08 work before P09.', 'Next: customer webhook subscription/delivery interfaces, then broader administrator interfaces. These remain P08 work before P09.'),
              ('- [Progress and next executable action](docs/implementation/PROGRESS.md)', '- [Progress and next executable action](docs/implementation/PROGRESS.md)\n- [P08D durable evidence and screenshots](docs/evidence/p08d-13bdd62.md)\n- [P08D machine-readable provenance](docs/evidence/p08d-13bdd62.json)\n- [P08D scoped requirements](docs/implementation/P08D_REQUIREMENTS.json)')]
          for old,new in replacements:
              require(readme.count(old) == 1, 'README target changed: ' + old)
              readme = readme.replace(old,new,1)
          p.write_text(readme)
          p = Path('docs/evidence/INDEX.md'); index = p.read_text()
          index = index.replace('# Evidence index — P08C verified, full product NO_GO', '## Historical evidence index — P08C checkpoint', 1).replace('## Current verified P08C evidence', '## Preserved verified P08C evidence', 1).replace('establishes the current verified milestone.', 'establishes that historical P08C milestone.', 1).replace('Customer schedule/webhook interfaces, the broader administrator interface,', 'Customer webhook interfaces, the broader administrator interface,', 1)
          p.write_text('# P08D verified checkpoint\n\nThe customer schedule milestone passed at `' + SOURCE + '`. See [report and screenshots](p08d-13bdd62.md), [JSON provenance](p08d-13bdd62.json) and [executed requirement matrix](p08d-13bdd62/requirements-matrix.md). Overall product remains **INCOMPLETE / NO_GO**. Entries below retain their original historical scope.\n\n' + index)
          p = Path('docs/implementation/DELIVERY.md'); delivery = p.read_text()
          require(delivery.startswith('# Delivery record — P08C verified'), 'Delivery checkpoint changed')
          delivery = delivery.replace('# Delivery record — P08C verified', '## Preserved P08C delivery record', 1).replace('Customer schedule and webhook interfaces and the broader administrator interface remain open,', 'Customer webhook interfaces and the broader administrator interface remain open,', 1)
          old_next = 'The next delivery unit is the customer schedule interface against the existing P07A API, with create/edit/pause/resume/cancel, zone/DST/catch-up explanations, occurrence results and exact-SHA browser/client/accessibility verification.'
          require(old_next in delivery, 'Delivery next action changed')
          delivery = delivery.replace(old_next, 'The next delivery unit is the customer webhook subscription/delivery interface against the existing P07B API. Preserve P01-P08D and verify integrated browser, authorization and recovery paths before the broader administrator interface and P09.', 1)
          p.write_text(f'''# Delivery record — P08D verified

          Repository: `{REPO}`. Branch: `main`.
          Verified implementation: `{SOURCE}`.
          P08D: `VERIFIED_PASS`. Full product: **INCOMPLETE / NO_GO**.

          Permanent run `{RUN}` and both required jobs passed. Artifact `{artifact['id']}` was downloaded and rehashed against GitHub's `{artifact['digest']}`. The [report](../evidence/p08d-13bdd62.md), [JSON provenance](../evidence/p08d-13bdd62.json) and four attested screenshots retain the verified source and artifact expiry separately from this documentation commit.

          Delivered: owner-scoped schedule management, version-aware lifecycle, immutable occurrences, pure temporal preview, preserved POST/PUT uncertainty recovery and responsive/accessible browser verification. Async-review focus restoration was repaired without weakening the earlier financial or browser gate. Customer webhook/admin interfaces and P09-P11 remain incomplete. No public deployment or release tag is claimed.

          The following records retain their historical P08C/P08B implementation SHAs and counts.

          ''' + delivery)
          p = Path('docs/implementation/RELEASE_READINESS.md')
          require(p.read_text().startswith('# Release readiness: NO_GO'), 'Release boundary changed')
          p.write_text(f'''# Release readiness: NO_GO

          **Overall status: INCOMPLETE. P01–P08D are verified development milestones. Customer webhook and broader administrator interfaces and P09–P11 remain open. No milestone is a complete product release.**

          Latest evidence: `{SOURCE}`, permanent run `{RUN}`; [P08D report](../evidence/p08d-13bdd62.md). Full-product gate states are not upgraded merely because this milestone passed.

          | Gate | State | Current evidence and missing work |
          |---|---|---|
          | G01 product workflows | IMPLEMENTED_UNVERIFIED | Exact-SHA-verified registration/session/accounts, history/detail, transfers/payments/cancellation, refunds/reversal and schedules. Customer webhook and broader administrator browser workflows remain incomplete. |
          | G02 independent financial invariants | IMPLEMENTED_UNVERIFIED | Protected posting, holds, settlement, adjustments, schedules, webhook isolation and reconciliation remain verified through P08D. Complete fault/load/restore campaigns remain open. |
          | G03 authentication/authorization | IMPLEMENTED_UNVERIFIED | Ownership, CSRF, ADMIN and webhook boundaries plus customer/admin session/expiry and money/schedule-command authorization are verified through P08D. Remaining interfaces and final security regression remain open. |
          | G04 idempotency/commit uncertainty | IMPLEMENTED_UNVERIFIED | Backend replay/conflict proofs and browser transfer/payment/cancellation/refund/reversal and POST/PUT schedule recovery pass. Final remaining boundaries and fault campaigns remain open. |
          | G05 messaging/recovery | VERIFIED_PASS | Preserved RabbitMQ outbox/inbox recovery, worker crash boundaries, webhook fan-out, leases, receiver deduplication and bounded restart recovery proofs pass. |
          | G06 F01–F08 faults | NOT_STARTED | Individual outage/response-loss and process-death proofs exist; the complete independently identified F01–F08 campaign is not implemented. |
          | G07 D01–D24 defects | NOT_STARTED | Selected probes exist; the required isolated complete seeded-defect campaign remains open. |
          | G08 all required test layers | BLOCKED | API/database/security/concurrency, messaging, schedules, webhooks and P08A–P08D browser/accessibility execute. Pact, remaining browser workflows, ZAP, k6 and later boundaries remain incomplete. |
          | G09 upgrade/restore | IMPLEMENTED_UNVERIFIED | Additive migrations through V10 are verified. Full financial-history backup/restore preservation remains incomplete. |
          | G10 reference performance | NOT_STARTED | No reference dataset or measured k6 report. |
          | G11 fresh setup/deploy | IMPLEMENTED_UNVERIFIED | Clean default topology, loopback UI and opt-in P07 overlay are verified through P08D. Final release-artifact deployment smoke remains incomplete. |
          | G12 release lab isolation | BLOCKED | Receiver fault modes are confined to the sandbox receiver; complete normal-artifact exclusion proof remains open. |
          | G13 documentation/evidence | IMPLEMENTED_UNVERIFIED | Foundation through P08D reports, requirements, ADRs and provenance exist. Full diagrams, ten integrated bug reports, final reports and video remain incomplete. |
          | G14 reports/screenshots/video | IMPLEMENTED_UNVERIFIED | Responsive P08A–P08D screenshots exist, including twelve P08D screenshots and four durable attested examples. Scanner, performance and final video packages remain incomplete. |
          | G15 GitHub/CI delivery | BLOCKED | Exact-SHA push verification exists through P08D with required gate and artifact provenance. Mandatory complete PR/nightly/release lanes must still succeed. |
          | G16 no release blockers | BLOCKED | Remaining P08 interfaces, P09–P11 and the other full-product gates are open. |

          These states apply to the complete original mandate. The secret scan is not a clean dependency audit or comprehensive security assurance. No certification, whole-product accessibility conformance, production-financial readiness or measured performance claim is made.
          ''')
          print(json.dumps({'sourceSha':SOURCE,'runId':RUN,'artifactId':artifact['id'],'digest':artifact['digest'],'executedTotals':totals,'p08dBrowserCases':summary['p08dBrowserCases'],'durableScreenshots':shots},indent=2))
          PY
      - name: Validate and push only the evidence documentation
        run: |
          git diff --check
          git add README.md docs/implementation/PROGRESS.md docs/implementation/DELIVERY.md docs/implementation/RELEASE_READINESS.md docs/evidence/INDEX.md docs/evidence/p08d-13bdd62.md docs/evidence/p08d-13bdd62.json docs/evidence/p08d-13bdd62/
          ./scripts/scan-secrets
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(p08d): retain successful exact-SHA verification and responsive evidence' -m 'Record actual generated counts and eight requirement mappings; verify downloaded artifact and screenshot hashes. Preserve historical milestones and full-product NO_GO. Advance the next executable action to customer webhook interfaces. No production code or verification assertions change.'
          git push origin HEAD:main
