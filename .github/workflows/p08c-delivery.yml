name: P08C checked source publication
on:
  push:
    branches: [main]
    paths: [.github/workflows/p08c-delivery.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Require unchanged ordinary source and materialize the reviewed patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --exit-code 4cc1b6d1268a4df106b0e6b8ecf31e16c7c344a4 HEAD -- . ':(exclude).github/workflows/p08c-delivery.yml'
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          chunks = ['b3dbe01de8013370e84d07aa068f94ad2628f8f9', '072c09c221ef584d4de3b7ec7be79c1b17bf9f53', '3df02f372960d5cc1a6351e6bb30b354aab60f2b', '12ac690d2df5e5114be50eb645e03002dd07208d']
          payload = bytearray()
          for sha in chunks:
              req = urllib.request.Request('https://api.github.com/repos/azerish25-ux/transaction-reliability-lab/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  record = json.load(response)
              assert record['encoding'] == 'base64'
              part = base64.b64decode(record['content'])
              assert hashlib.sha1(b'blob ' + str(len(part)).encode() + b'\0' + part).hexdigest() == sha
              payload.extend(part)
          patch = lzma.decompress(payload)
          assert hashlib.sha256(patch).hexdigest() == 'aee6fcf025775ddf66244fc22388c8de8b35a62ee3e4a7f76ec137a1d7e0c74a'
          pathlib.Path('/tmp/p08c-source.patch').write_bytes(patch)
          print('Verified ordinary-source patch:', len(patch), 'bytes')
          PY
          git apply --check --unidiff-zero /tmp/p08c-source.patch
          git apply --unidiff-zero /tmp/p08c-source.patch
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def revise(path, before, after, old=None, new=None):
              p=Path(path); text=p.read_text()
              assert hashlib.sha256(text.encode()).hexdigest()==before, path
              if old is None: text=text.rstrip()+'\n'
              else:
                  assert text.count(old)==1, path
                  text=text.replace(old,new)
              assert hashlib.sha256(text.encode()).hexdigest()==after, path
              p.write_text(text)
          revise('frontend/src/product-ui.tsx','44ca00ff1c705cf42faa8e0dcf2209538a4cff73c577fb0863929a9ed867a89d','f8d07ee53bf78ffd260e793c4fbf0f76580bd7887617f657ad18078044f2119e')
          revise('frontend/src/api.ts','0aadeff6360683c816ab5c4588458a6750341e43aacd97c99ce9a917e5e2989b','fb8ad9d88576efaa919380cc1142c7d535dd247a564a260f45db974be2e388a4',"      if (method === 'POST' && key) throw new OutcomeUnknown();\n      throw cause;","      if (method === 'POST' && key) throw new OutcomeUnknown();\n      if (method === 'GET') throw new Error('Authoritative data could not be loaded. Refresh to retry; no financial outcome has been inferred.', { cause });\n      throw cause;")
          revise('frontend/tests/e2e/p08b.spec.ts','8bffd1a95a60c52107e57b33cf80f42a09f35cf015755290064e8194e6643783','433538e5366beafd5fd7a2dea92163c16dd1025a3fac8b8763ce7f12ff683846',"[...common, 'up', '-d', '--wait', 'payment-worker-a', 'payment-worker-b']","[...common, 'up', '-d', '--no-deps', '--wait', 'payment-worker-a', 'payment-worker-b']")
          revise('tests/contracts/p08c-client.test.cjs','faf49b594c50ecaae66619deb59c9577ca7b7f9644eeabea335f25caa3df3d34','813bc22594c5c7d834c585835d1f1753de275ff53da90a7df7c59f55aa633f00',"test('P08CTS17-invalid-context-identity-never-reaches-network', () => {\n  let calls = 0; const api = new ApiClient(async () => { calls++; return Response.json(context); });\n  assert.throws(() => api.paymentAdjustmentContext('invalid', true)); assert.equal(calls, 0);\n});","test('P08CTS17-invalid-context-identity-and-unavailable-read-do-not-imply-money-failure', async () => {\n  let calls = 0; const api = new ApiClient(async () => { calls++; return Response.json(context); });\n  assert.throws(() => api.paymentAdjustmentContext('invalid', true)); assert.equal(calls, 0);\n  const offline = new ApiClient(async () => { throw new TypeError('Failed to fetch'); });\n  await assert.rejects(offline.paymentAdjustmentContext(paymentId), error => !(error instanceof TypeError) && !(error instanceof OutcomeUnknown) && error.message.includes('no financial outcome has been inferred'));\n});")
          PY
          git add -N -- . ':(exclude).github'
          git diff --check
          git diff --exit-code -- .github
      - name: Verify locked dependencies, application, contracts and component regressions
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm --prefix frontend run verify
          chmod +x scripts/lab scripts/test-core scripts/test-client
          ./scripts/lab test unit
      - name: Commit ordinary source and fast-forward main
        run: |
          set -euo pipefail
          git add -A -- . ':(exclude).github'
          git diff --cached --check
          if git diff --cached --name-only | grep -q '^.github/'; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(p08c): add replay-safe refund and administrator reversal journeys' -m 'Add owner-safe adjustment context, exact-money customer refunds, narrow admin reversal, immutable receipts/history, preserved expiry recovery and real database-backed responsive browser proofs. Keep the full product NO_GO pending exact-SHA verification.'
          git push origin HEAD:main
          echo "Published source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
