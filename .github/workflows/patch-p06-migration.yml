name: Patch P06 migration assertion

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: "${{ github.event.head_commit.message == 'chore: route P06 migration assertion fix' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out routing commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Update exact migration-history expectation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('backend/src/test/java/lab/ledgerguard/AuthenticationAccountsIT.java')
          text = path.read_text(encoding='utf-8')
          old = 'assertEquals(7,count("SELECT count(*) FROM public.flyway_schema_history WHERE success AND version IS NOT NULL"));'
          new = 'assertEquals(8,count("SELECT count(*) FROM public.flyway_schema_history WHERE success AND version IS NOT NULL"));'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one stale migration assertion, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
      - name: Commit and publish regression correction
        run: |
          git config user.name 'azerish25-ux'
          git config user.email 'azerish25@gmail.com'
          git add backend/src/test/java/lab/ledgerguard/AuthenticationAccountsIT.java
          git commit -m 'test: expect P06 migration history'
          git push origin HEAD:main
