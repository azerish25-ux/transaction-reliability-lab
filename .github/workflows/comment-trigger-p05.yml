name: Comment trigger for P05 integration

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.issue.number == 1 && (github.event.comment.body == '/integrate-p05' || github.event.comment.body == '/prepare-p05-hardening' || github.event.comment.body == '/publish-p05-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch requested P05 workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMAND: ${{ github.event.comment.body }}
        run: |
          if [ "$COMMAND" = "/prepare-p05-hardening" ]; then
            gh workflow run prepare-p05-hardening.yml --ref main
          elif [ "$COMMAND" = "/publish-p05-smoke" ]; then
            gh workflow run publish-p05-smoke.yml --ref main
          else
            gh workflow run scheduled-p05.yml --ref main
          fi
