name: Comment trigger for P05 integration

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.issue.number == 1 && github.event.comment.body == '/integrate-p05'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch verified integration
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run scheduled-p05.yml --ref main
