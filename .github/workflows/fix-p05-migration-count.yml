name: Fix P05 migration regression

on:
  push:
    branches: [p05-async-payments]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: p05-async-payments
          fetch-depth: 0
      - name: Update historical migration assertion
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/src/test/java/lab/ledgerguard/AuthenticationAccountsIT.java')
          source = path.read_text()
          source = source.replace(
              '// Exercise a real V5->V6 upgrade rather than only a fresh install.',
              '// Exercise a real V5->current upgrade rather than only a fresh install.'
          )
          source = source.replace(
              'assertEquals(6,count("SELECT count(*) FROM public.flyway_schema_history WHERE success AND version IS NOT NULL"));',
              'assertEquals(7,count("SELECT count(*) FROM public.flyway_schema_history WHERE success AND version IS NOT NULL"));'
          )
          path.write_text(source)
          PY
          git diff --check
          git diff --exit-code --quiet && { echo 'Expected migration assertion change was not made'; exit 1; } || true
          git add backend/src/test/java/lab/ledgerguard/AuthenticationAccountsIT.java
          git config user.name 'azerish25-ux'
          git config user.email 'azerish25@gmail.com'
          git commit -m 'test: expect P05 migration during historical upgrade'
          git push origin HEAD:p05-async-payments
