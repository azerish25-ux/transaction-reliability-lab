name: Scheduled verified P05 integration

on:
  schedule:
    - cron: '12 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    name: Fix, verify and publish P05
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out P05 candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: p05-async-payments
          fetch-depth: 0

      - name: Configure Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Configure Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Correct poison-work proof and remove temporary snapshot step
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          smoke = Path("scripts/smoke-auth")
          text = smoke.read_text()
          old = '''# Poison work is bounded, inspectable and auditable through the administrator replay path.
          poison_id=str(uuid.uuid4());rabbit_publish("payment.requested",'{"malformed":true}',poison_id)
          wait_sql(f"SELECT count(*) FROM ledger.failed_work WHERE event_id='{poison_id}' AND state='FAILED'","1",45)
          admin=Browser();admin.login("admin@example.test",VALUES["LEDGER_DEMO_PASSWORD"])
          status,failed_page,_=admin.call("/admin/failed-work?limit=100&offset=0")
          work=next(item for item in failed_page["items"] if item["eventId"]==poison_id)
          check("poison-work-admin-inspection",status==200 and work["attempts"]==1)
          '''
          new = '''# Poison work is bounded per consumer, inspectable and auditable through the administrator replay path.
          poison_id=str(uuid.uuid4());rabbit_publish("payment.requested",'{"malformed":true}',poison_id)
          wait_sql(f"SELECT string_agg(consumer,':' ORDER BY consumer) FROM ledger.failed_work WHERE event_id='{poison_id}' AND state='FAILED'","payment-projection-v1:payment-settler-v1",45)
          admin=Browser();admin.login("admin@example.test",VALUES["LEDGER_DEMO_PASSWORD"])
          status,failed_page,_=admin.call("/admin/failed-work?limit=100&offset=0")
          poison_work=[item for item in failed_page["items"] if item["eventId"]==poison_id]
          check("poison-work-admin-inspection",status==200 and {item["consumer"] for item in poison_work}=={"payment-projection-v1","payment-settler-v1"} and all(item["attempts"]==1 for item in poison_work))
          work=next(item for item in poison_work if item["consumer"]=="payment-settler-v1")
          '''
          if old not in text:
              raise SystemExit("expected poison-work block was not found")
          smoke.write_text(text.replace(old, new, 1))

          workflow = Path(".github/workflows/pr.yml")
          flow = workflow.read_text()
          flow, count = re.subn(
              r'\n      - name: Publish temporary source snapshot\n.*?(?=\n      - name: Configure Java 21)',
              '\n',
              flow,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("temporary source-snapshot step was not found exactly once")
          workflow.write_text(flow)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/smoke-auth .github/workflows/pr.yml
          git diff --cached --check
          git commit -m "fix: verify poison work per consumer"

      - name: Prepare deterministic tools
        run: chmod +x mvnw scripts/lab scripts/test-core scripts/test-client scripts/assert-p04-evidence scripts/assert-p05-evidence scripts/smoke-auth scripts/unit-probes scripts/validate-evidence scripts/scan-secrets infra/docker/postgres/00-roles.sh

      - name: Install locked TypeScript dependency
        run: npm ci --prefix frontend

      - name: Run Java and TypeScript component regressions
        run: ./scripts/lab test unit

      - name: Execute JUnit, PostgreSQL and two-process HTTP verification
        run: ./mvnw -B -ntp -f backend/pom.xml verify

      - name: Validate Compose model
        run: docker compose --env-file .env.example -f compose.yaml config --quiet

      - name: Scan tracked source for high-signal literal secrets
        run: ./scripts/scan-secrets

      - name: Start, migrate, seed and reconcile the complete P05 topology
        run: ./scripts/lab up

      - name: Exercise payments, RabbitMQ, duplicate delivery and process-death recovery
        run: python3 scripts/smoke-auth

      - name: Verify live status and repeatable reconciliation
        run: |
          ./scripts/lab status
          ./scripts/lab reconcile

      - name: Require executed P03/P04/P05 traceability
        run: python3 scripts/assert-p05-evidence

      - name: Capture service logs
        if: always()
        run: ./scripts/lab logs

      - name: Stop scoped environment
        if: always()
        run: ./scripts/lab down

      - name: Publish candidate branch and squash onto main
        run: |
          set -euo pipefail
          git status --porcelain --untracked-files=no | grep -q . && {
            echo "Tracked tree changed after verification" >&2
            git status --short
            exit 1
          } || true
          git push origin HEAD:p05-async-payments
          git fetch origin main
          git checkout -B main origin/main
          git read-tree --reset -u p05-async-payments
          git diff --cached --check
          git commit -m "feat: implement P05 asynchronous payment reliability"
          git push origin HEAD:main
