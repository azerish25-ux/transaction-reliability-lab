name: Publish verified P05 smoke correction

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out P05 candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: p05-async-payments
          fetch-depth: 0

      - name: Apply the already-verified per-consumer poison-work proof
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/smoke-auth")
          text = path.read_text()
          old = '''# Poison work is bounded, inspectable and auditable through the administrator replay path.
          poison_id=str(uuid.uuid4());rabbit_publish("payment.requested",'{"malformed":true}',poison_id)
          wait_sql(f"SELECT count(*) FROM ledger.failed_work WHERE event_id='{poison_id}' AND state='FAILED'","1",45)
          admin=Browser();admin.login("admin@example.test",VALUES["LEDGER_DEMO_PASSWORD"])
          status,failed_page,_=admin.call("/admin/failed-work?limit=100&offset=0")
          work=next(item for item in failed_page["items"] if item["eventId"]==poison_id)
          check("poison-work-admin-inspection",status==200 and work["attempts"]==1)
          '''
          new = '''# Poison work is bounded per consumer, inspectable and auditable through the administrator replay path.
          poison_id=str(uuid.uuid4());rabbit_publish("payment.requested",'{"malformed":true}',poison_id)
          wait_sql(f"SELECT string_agg(consumer,':' ORDER BY consumer) FROM ledger.failed_work WHERE event_id='{poison_id}' AND state='FAILED'","payment-projection-v1:payment-settler-v1",45)
          admin=Browser();admin.login("admin@example.test",VALUES["LEDGER_DEMO_PASSWORD"])
          status,failed_page,_=admin.call("/admin/failed-work?limit=100&offset=0")
          poison_work=[item for item in failed_page["items"] if item["eventId"]==poison_id]
          check("poison-work-admin-inspection",status==200 and {item["consumer"] for item in poison_work}=={"payment-projection-v1","payment-settler-v1"} and all(item["attempts"]==1 for item in poison_work))
          work=next(item for item in poison_work if item["consumer"]=="payment-settler-v1")
          '''
          if text.count(old) != 1:
              raise SystemExit("expected poison-work block was not found exactly once")
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/smoke-auth
          git diff --cached --check
          git commit -m "fix: verify poison work per consumer"
          git push origin HEAD:p05-async-payments
