name: Apply verified P08B status-label repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-p08b-status-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    name: Patch, verify and publish the P08B status-label repair
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out current main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 1

      - name: Configure Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Configure Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply the exact semantic status-label repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/p08b-ui.tsx')
          source = path.read_text(encoding='utf-8')
          before = '<span className="status-badge p08b-status success"><span aria-hidden="true">✓</span>Settled</span>'
          after = '<span className="status-badge p08b-status success"><span aria-hidden="true">✓</span><span>Settled</span></span>'
          matches = source.count(before)
          if matches != 1:
              raise SystemExit(f'Expected exactly one transfer-receipt status label, found {matches}')
          path.write_text(source.replace(before, after), encoding='utf-8')
          PY
          git diff --check
          git diff -- frontend/src/p08b-ui.tsx

      - name: Prepare deterministic tools
        run: chmod +x mvnw scripts/lab scripts/test-core scripts/test-client scripts/assert-p04-evidence scripts/assert-p05-evidence scripts/assert-p06-evidence scripts/assert-p07a-evidence scripts/assert-p07b-evidence scripts/assert-p08a-evidence scripts/assert-p08b-evidence scripts/smoke-auth scripts/smoke-adjustments scripts/smoke-schedules scripts/smoke-webhooks scripts/unit-probes scripts/validate-evidence scripts/scan-secrets infra/docker/postgres/00-roles.sh

      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend --ignore-scripts --no-audit --no-fund

      - name: Verify strict source, contracts and production build
        run: npm --prefix frontend run verify

      - name: Install exact Chromium runtime
        run: npm exec --prefix frontend -- playwright install --with-deps chromium

      - name: Start the real P08B topology
        run: ./scripts/lab up

      - name: Run every responsive P08A and P08B browser journey
        run: npm --prefix frontend run test:e2e

      - name: Capture logs
        if: always()
        run: |
          ./scripts/lab logs || true
          mkdir -p .evidence/compose
          docker compose --env-file .ledgerguard/runtime.env -f compose.yaml -f compose.p07.yaml logs --no-color > .evidence/compose/p08b-status-repair-services.log 2>&1 || true

      - name: Stop the scoped environment
        if: always()
        run: |
          docker compose --env-file .ledgerguard/runtime.env -f compose.yaml -f compose.p07.yaml down --remove-orphans || true
          ./scripts/lab down || true

      - name: Commit and push the verified source repair
        run: |
          git diff --exit-code -- . ':(exclude)frontend/src/p08b-ui.tsx'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/p08b-ui.tsx
          git commit -m 'fix(p08b): expose standalone receipt status label'
          git push origin HEAD:main
