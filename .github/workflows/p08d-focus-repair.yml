name: P08D focus repair publisher
on:
  push:
    branches: [main]
    paths: [.github/workflows/p08d-focus-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Repair explicit return focus and strengthen both dismissal paths
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace_once(text, old, new):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one repair target, found {count}: {old[:100]}')
              return text.replace(old, new, 1)
          p = Path('frontend/src/product-ui.tsx')
          text = p.read_text()
          text = replace_once(text, 'type PropsWithChildren, type ReactNode', 'type PropsWithChildren, type ReactNode, type RefObject')
          text = replace_once(text, "children, initialFocus = 'confirm' }: PropsWithChildren<{", "children, initialFocus = 'confirm', returnFocus }: PropsWithChildren<{")
          text = replace_once(text, "onCancel: () => void; onConfirm: () => void; initialFocus?: 'cancel' | 'confirm';", "onCancel: () => void; onConfirm: () => void; initialFocus?: 'cancel' | 'confirm';\n  returnFocus?: RefObject<HTMLElement>;")
          text = replace_once(text,
              '    return () => { element.close(); if (previous?.isConnected) previous.focus(); };\n  }, [open, initialFocus]);',
              '    return () => {\n      element.close();\n      // Async review can disable and blur its trigger before the dialog opens.\n      // Prefer the explicit trigger, retaining automatic restoration for other callers.\n      const target = returnFocus?.current ?? previous;\n      if (target?.isConnected) target.focus();\n    };\n  }, [open, initialFocus, returnFocus]);')
          p.write_text(text)
          p = Path('frontend/src/p08d-ui.tsx')
          text = p.read_text()
          text = replace_once(text, '  const reviewLock = useRef(false);', '  const reviewLock = useRef(false);\n  const reviewButton = useRef<HTMLButtonElement>(null);')
          text = replace_once(text, '<button className="button button-primary" type="submit">{reviewing ?', '<button ref={reviewButton} className="button button-primary" type="submit">{reviewing ?')
          text = replace_once(text, 'onCancel={() => setReview(undefined)} onConfirm={() => void confirm()} initialFocus="cancel">', 'onCancel={() => setReview(undefined)} onConfirm={() => void confirm()} initialFocus="cancel" returnFocus={reviewButton}>')
          p.write_text(text)
          p = Path('frontend/tests/e2e/p08d.spec.ts')
          text = p.read_text()
          old = "    await page.keyboard.press('Escape'); await expect(dialog).not.toBeVisible(); await expect(page.getByRole('button', { name: 'Review schedule', exact: true })).toBeFocused();"
          new = old + "\n    // Reopen through the keyboard and verify the visible dismissal restores the same trigger.\n    await page.keyboard.press('Enter');\n    await expect(dialog).toBeVisible();\n    await expect(dialog.getByRole('button', { name: 'Go back' })).toBeFocused();\n    await dialog.getByRole('button', { name: 'Go back' }).click();\n    await expect(dialog).not.toBeVisible();\n    await expect(page.getByRole('button', { name: 'Review schedule', exact: true })).toBeFocused();"
          text = replace_once(text, old, new)
          p.write_text(text)
          PY
      - name: Check the exact patch
        run: |
          git diff --check
          git diff --stat
          git diff -- frontend/src/product-ui.tsx frontend/src/p08d-ui.tsx frontend/tests/e2e/p08d.spec.ts
      - name: Verify all frontend types contracts and production build
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm --prefix frontend run verify
      - name: Commit and push only the repaired source and regression test
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/product-ui.tsx frontend/src/p08d-ui.tsx frontend/tests/e2e/p08d.spec.ts
          git commit -m 'fix(p08d): restore schedule review focus after asynchronous preview' -m 'Keep an explicit review-trigger ref across the disabled preview phase. Preserve automatic focus restoration for other dialogs. Retain the Escape assertion and add keyboard reopening and Go back restoration checks for Halifax gap, overlap and UTC at all three viewports.'
          git push origin HEAD:main
