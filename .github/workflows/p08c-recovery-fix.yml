name: P08C recovery routing correction
on:
  push:
    branches: [main]
    paths: [.github/workflows/p08c-recovery-fix.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply exact reviewed source edits
        run: |
          set -euo pipefail
          git diff --exit-code a80c87e638a6f0103ad73388094f1d06951ed02f HEAD -- . ':(exclude).github/workflows/p08c-recovery-fix.yml'
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, zlib
          encoded = ''
          edits_bytes=zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(edits_bytes).hexdigest() == 'c6fc0964b01c97384663adf822f3883d79234bb3be445e92f464c2879f8fc072'
          for change in json.loads(edits_bytes):
              assert change['path'] in ('frontend/src/App.tsx','frontend/tests/e2e/p08c.spec.ts')
              path=pathlib.Path(change['path']); text=path.read_text()
              assert hashlib.sha256(text.encode()).hexdigest()==change['before']
              assert text.count(change['old'])==1
              text=text.replace(change['old'],change['new'])
              assert hashlib.sha256(text.encode()).hexdigest()==change['after']
              path.write_text(text)
          PY
          git diff --check
      - name: Verify application, browser types and production client contracts
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm --prefix frontend run verify
      - name: Commit and fast-forward source
        run: |
          set -euo pipefail
          git add frontend/src/App.tsx frontend/tests/e2e/p08c.spec.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(p08c): restore preserved refunds through the product router' -m 'Notify the outer product router on dashboard navigation and synchronize the real session-revocation test with completed authoritative reads. Retain explicit 401 admission, same-key replay and independent single-adjustment assertions.'
          git push origin HEAD:main
          echo "Corrected source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
