name: P08C inspected interface correction
on:
  push:
    branches: [main]
    paths: [.github/workflows/p08c-recovery-fix.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply exact screenshot-review corrections
        run: |
          set -euo pipefail
          git diff --exit-code 8a608b807e93c2aa21d92396216cea1abbc27f80 HEAD -- . ':(exclude).github/workflows/p08c-recovery-fix.yml'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def revise(path, before, after, replacements):
              p=Path(path); text=p.read_text()
              assert hashlib.sha256(text.encode()).hexdigest()==before, path
              for old,new in replacements:
                  assert text.count(old)==1, path
                  text=text.replace(old,new)
              assert hashlib.sha256(text.encode()).hexdigest()==after, path
              p.write_text(text)
          revise('frontend/src/p08b.css','00f58177a91f95475120f76ab6edafed7355a5cfe7d8e1ddf544cdbcdffb6ed9','e8f7b2948c3a911305fc07deff9a73ce30ffd41d809837a04d4607de94dac26d',[
              ('@media (max-width: 640px) {\n  .p08b-shell .site-header { position: static; display: grid; }\n  .p08b-shell .site-header nav { justify-content: flex-start; gap: .25rem; }\n  .p08b-shell .nav-link { padding: .6rem; }','@media (max-width: 650px) {\n  .site-header { position: static; display: grid; gap: .75rem; }\n  .site-header nav { margin-left: 0; flex-wrap: wrap; justify-content: flex-start; gap: .25rem; }\n  .site-header .nav-link { display: inline-flex; padding: .6rem; }')
          ])
          revise('frontend/src/p08c.css','164179686231f8a723c4d088f83c0b0056b34892425502cd9ae02f58e74029de','0105a807a9bcad7844d94cfa9bcb70bb4de3c6cbc8ab0293cda4173e4a8bf618',[
              ('.adjustment-section {','.adjustment-page-heading { display: block; }\n.adjustment-page-heading > p:last-child { max-width: 42rem; }\n.adjustment-page-heading code { overflow-wrap: anywhere; }\n.adjustment-section {')
          ])
          revise('frontend/src/p08c-ui.tsx','9488a024e167436e6d9b594a966778d8030761e99dc7876d4b776096be00099a','5af811a18120f5bd62bda958bdf8045d20148bc4265ea88f7a3ce7925d4eb751',[
              ('onChange={event => setAmount(event.target.value)}','onChange={event => { setAmount(event.target.value); setErrors(previous => { const next = { ...previous }; delete next.amount; return next; }); }}'),
              ('onChange={event => setReason(event.target.value)}','onChange={event => { setReason(event.target.value); setErrors(previous => { const next = { ...previous }; delete next.reason; return next; }); }}'),
              ('<header className="page-heading"><p className="eyebrow">Administrator','<header className="page-heading adjustment-page-heading"><p className="eyebrow">Administrator'),
              ('<header className="page-heading"><p className="eyebrow">Restricted','<header className="page-heading adjustment-page-heading"><p className="eyebrow">Restricted')
          ])
          revise('frontend/tests/e2e/p08c-fixtures.ts','481d439306621c4e7a15f4e7e1383ee93698adb3d4125e96611913d1834340be','21d1463f72ea9f4000d3dc14a9e68e3ea29e7b1e5f7e924dae272c456dde7e71',[
              ('  await page.screenshot({ path: path.join(folder, `${info.project.name}-${name}.png`), fullPage: true });',"  // Start at the real document top so full-page capture cannot stitch offscreen fixed controls into view.\n  await page.evaluate(() => window.scrollTo({ top: 0, behavior: 'instant' }));\n  await expect.poll(() => page.evaluate(() => window.scrollY)).toBe(0);\n  await page.screenshot({ path: path.join(folder, `${info.project.name}-${name}.png`), fullPage: true, animations: 'disabled' });")
          ])
          revise('frontend/tests/e2e/p08c.spec.ts','55276919313b1cbd0381e8985c0c31f68ee69c0062ddaaed4861cf0b916940b2','e0607b25191faef975c1d7d9dbaef53bc07b67255220c099b0bc7774039ee438',[
              ("  await expect(page.getByRole('heading', { name: 'Refunds and adjustments' })).toBeVisible();","  await expect(page.getByRole('heading', { name: 'Refunds and adjustments' })).toBeVisible();\n  const navigation = page.getByRole('navigation', { name: 'Primary navigation' });\n  for (const name of ['Dashboard', 'Transfer', 'Payments']) await expect(navigation.getByRole('link', { name, exact: true })).toBeVisible();"),
              ("  const f = await lab.settled(), admin = await lab.actor(true); await signIn(page, admin);\n  await page.getByLabel('Payment ID', { exact: true }).fill(f.payment.id);","  const f = await lab.settled(), admin = await lab.actor(true); await signIn(page, admin);\n  await expect(page.getByRole('navigation', { name: 'Primary navigation' }).getByRole('link', { name: 'Adjustments', exact: true })).toBeVisible();\n  await page.getByLabel('Payment ID', { exact: true }).fill(f.payment.id);"),
              ("  await page.getByLabel('Reversal reason (required)').fill('  Authorized duplicate-payment correction  ');","  await page.getByLabel('Reversal reason (required)').fill('  Authorized duplicate-payment correction  ');\n  await expect(page.getByLabel('Reversal reason (required)')).toHaveAttribute('aria-invalid', 'false');")
          ])
          PY
          git diff --check
      - name: Verify application and contracts with responsive browser assertions
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm --prefix frontend run verify
      - name: Commit and fast-forward source
        run: |
          set -euo pipefail
          git add frontend/src/p08b.css frontend/src/p08c.css frontend/src/p08c-ui.tsx frontend/tests/e2e/p08c-fixtures.ts frontend/tests/e2e/p08c.spec.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(p08c): preserve mobile navigation and readable adjustment review' -m 'Keep customer and admin links visible at mobile widths, stack administrator headings, clear stale field errors on edit and capture screenshots from the document top. Assert navigation and corrected field state in the real browser journeys.'
          git push origin HEAD:main
          echo "Corrected source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
