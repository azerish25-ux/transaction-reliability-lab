name: P08C recovery routing correction
on:
  push:
    branches: [main]
    paths: [.github/workflows/p08c-recovery-fix.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply exact reviewed source edits
        run: |
          set -euo pipefail
          git diff --exit-code a80c87e638a6f0103ad73388094f1d06951ed02f HEAD -- . ':(exclude).github/workflows/p08c-recovery-fix.yml'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def revise(path, before, after, replacements):
              p=Path(path); text=p.read_text()
              assert hashlib.sha256(text.encode()).hexdigest()==before, path
              for old,new in replacements:
                  assert text.count(old)==1, path
                  text=text.replace(old,new)
              assert hashlib.sha256(text.encode()).hexdigest()==after, path
              p.write_text(text)
          revise('frontend/src/App.tsx', '6f4ce0a9620f94ea576f76c55a57af2517bd9ea1841318331ea86cacdd29e077', '02eafd3585572b7925d31753a2b30da43f92b903826f89ddd102cc8cf3034cfd', [
              ("    setPath(normalized);\n    window.scrollTo({ top: 0, behavior: 'auto' });", "    setPath(normalized);\n    // Notify the outer product router when a preserved instruction leaves the dashboard.\n    window.dispatchEvent(new PopStateEvent('popstate', { state: null }));\n    window.scrollTo({ top: 0, behavior: 'auto' });")
          ])
          revise('frontend/tests/e2e/p08c.spec.ts', '980255f66208d94c748aea9de729fc5d64a26aace4dc99cf60894d8451b37b8f', '55276919313b1cbd0381e8985c0c31f68ee69c0062ddaaed4861cf0b916940b2', [
              ("  await page.getByRole('link', { name: 'Resolve safely' }).first().click();\n  // Revoke the real browser session without erasing its preserved economic intent.", "  await page.getByRole('link', { name: 'Resolve safely' }).first().click();\n  await expect(page.getByRole('heading', { name: 'Payment details', exact: true })).toBeVisible();\n  // Finish the observable authoritative read before revocation; a pending GET may otherwise\n  // correctly expire the UI before the intended POST admission-boundary assertion.\n  await expect(page.getByRole('button', { name: 'Refresh adjustments', exact: true })).toBeEnabled();\n  await expect(page.getByRole('button', { name: 'Retry same refund', exact: true })).toBeVisible();\n  // Revoke the real browser session without erasing its preserved economic intent."),
              ("  await page.getByRole('button', { name: 'Retry same refund' }).click();\n  await expect(page.getByRole('dialog', { name: 'Your session ended' })).toBeVisible();", "  const denied = page.waitForResponse(r => r.request().method() === 'POST' && r.url().endsWith(`/payments/${f.payment.id}/refunds`) && r.status() === 401, { timeout: 15_000 });\n  await page.getByRole('button', { name: 'Retry same refund' }).click({ timeout: 10_000 });\n  expect((await denied).status()).toBe(401);\n  await expect(page.getByRole('dialog', { name: 'Your session ended' })).toBeVisible();"),
              ("  await signIn(page, f.recipient); await page.getByRole('link', { name: 'Resolve safely' }).first().click();\n  const replay = page.waitForResponse(r => r.request().method() === 'POST' && r.url().endsWith(`/payments/${f.payment.id}/refunds`) && r.status() === 201);\n  await page.getByRole('button', { name: 'Retry same refund' }).click(); expect((await replay).headers()['idempotency-replayed']).toBe('true');", "  await signIn(page, f.recipient); await page.getByRole('link', { name: 'Resolve safely' }).first().click();\n  await expect(page).toHaveURL(new RegExp(`/payments/${f.payment.id}$`));\n  await expect(page.getByRole('heading', { name: 'Payment details', exact: true })).toBeVisible();\n  await expect(page.getByRole('button', { name: 'Refresh adjustments', exact: true })).toBeEnabled();\n  await expect(page.getByRole('button', { name: 'Retry same refund', exact: true })).toBeVisible();\n  const replay = page.waitForResponse(r => r.request().method() === 'POST' && r.url().endsWith(`/payments/${f.payment.id}/refunds`) && r.status() === 201, { timeout: 15_000 });\n  await page.getByRole('button', { name: 'Retry same refund' }).click({ timeout: 10_000 }); expect((await replay).headers()['idempotency-replayed']).toBe('true');")
          ])
          PY
          git diff --check
      - name: Verify application, browser types and production client contracts
        run: |
          npm ci --prefix frontend --ignore-scripts --no-audit --no-fund
          npm --prefix frontend run verify
      - name: Commit and fast-forward source
        run: |
          set -euo pipefail
          git add frontend/src/App.tsx frontend/tests/e2e/p08c.spec.ts
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(p08c): restore preserved refunds through the product router' -m 'Notify the outer product router on dashboard navigation and synchronize the real session-revocation test with completed authoritative reads. Retain explicit 401 admission, same-key replay and independent single-adjustment assertions.'
          git push origin HEAD:main
          echo "Corrected source: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
