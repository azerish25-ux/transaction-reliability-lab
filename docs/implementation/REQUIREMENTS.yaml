      "requirement": "Default to eight total attempts, including the first. After failed attempt n, use min(300 seconds, 2 seconds × 2^(n−1)) as the base delay, apply bounded 0.8–1.2 jitter, and cap the final delay at 300 seconds. Use a one-second connection timeout, three-second response timeout, five-second overall attempt deadline, and 24-hour maximum delivery age. Record seeded jitter in deterministic tests. Honor Retry-After only within policy bounds. Persist scheduling across restarts; do not implement retries using sleeping request threads.",
