name: ${COMPOSE_PROJECT_NAME:-ledgerguard}

x-ledger-runtime: &ledger-runtime
  LEDGER_SANDBOX_HTTP: "true"
  LEDGER_AUTH_KEY: ${LEDGER_AUTH_KEY:?LEDGER_AUTH_KEY is required}
  LEDGER_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ledgerguard}
  LEDGER_RUNTIME_USER: ledger_runtime
  LEDGER_RUNTIME_PASSWORD: ${LEDGER_RUNTIME_PASSWORD:?LEDGER_RUNTIME_PASSWORD is required}

x-ledger-rabbit: &ledger-rabbit
  LEDGER_RABBIT_HOST: rabbitmq
  LEDGER_RABBIT_PORT: 5672
  LEDGER_RABBIT_USER: ${RABBITMQ_DEFAULT_USER:-ledgerguard}
  LEDGER_RABBIT_PASSWORD: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
  LEDGER_RABBIT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/ledgerguard}

x-service-security: &service-security
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  stop_grace_period: 25s
  networks:
    - ledgerguard

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledgerguard}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}
      LEDGER_OWNER_PASSWORD: ${LEDGER_OWNER_PASSWORD:?LEDGER_OWNER_PASSWORD is required}
      LEDGER_RUNTIME_PASSWORD: ${LEDGER_RUNTIME_PASSWORD:?LEDGER_RUNTIME_PASSWORD is required}
    volumes:
      - ledgerguard-postgres:/var/lib/postgresql/data
      - ./infra/docker/postgres/00-roles.sh:/docker-entrypoint-initdb.d/00-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    networks:
      - ledgerguard

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    hostname: ledgerguard-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-ledgerguard}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/ledgerguard}
    ports:
      - "127.0.0.1:${LEDGER_RABBIT_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - ledgerguard-rabbit:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - ledgerguard

  api:
    <<: *service-security
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    environment:
      <<: *ledger-runtime
      SPRING_PROFILES_ACTIVE: sandbox
      LEDGER_PROCESS_NAME: LedgerGuard-API
      LEDGER_MIGRATION_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ledgerguard}
      LEDGER_OWNER_USER: ledger_owner
      LEDGER_OWNER_PASSWORD: ${LEDGER_OWNER_PASSWORD:?LEDGER_OWNER_PASSWORD is required}
      LEDGER_MESSAGING_ENABLED: "false"
      LEDGER_OUTBOX_PUBLISHER_ENABLED: "false"
      LEDGER_PAYMENT_WORKER_ENABLED: "false"
    ports:
      - "127.0.0.1:${LEDGER_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  outbox-publisher:
    <<: *service-security
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    environment:
      <<: [*ledger-runtime, *ledger-rabbit]
      SPRING_PROFILES_ACTIVE: sandbox
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      LEDGER_PROCESS_NAME: LedgerGuard-Outbox
      LEDGER_FLYWAY_ENABLED: "false"
      LEDGER_MESSAGING_ENABLED: "true"
      LEDGER_OUTBOX_PUBLISHER_ENABLED: "true"
      LEDGER_PAYMENT_WORKER_ENABLED: "false"
      LEDGER_DATABASE_POOL_SIZE: 6
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment-worker-a:
    <<: *service-security
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    environment:
      <<: [*ledger-runtime, *ledger-rabbit]
      SPRING_PROFILES_ACTIVE: sandbox
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      LEDGER_PROCESS_NAME: LedgerGuard-Worker-A
      LEDGER_FLYWAY_ENABLED: "false"
      LEDGER_MESSAGING_ENABLED: "true"
      LEDGER_OUTBOX_PUBLISHER_ENABLED: "false"
      LEDGER_PAYMENT_WORKER_ENABLED: "true"
      LEDGER_DATABASE_POOL_SIZE: 8
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment-worker-b:
    <<: *service-security
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    environment:
      <<: [*ledger-runtime, *ledger-rabbit]
      SPRING_PROFILES_ACTIVE: sandbox
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      LEDGER_PROCESS_NAME: LedgerGuard-Worker-B
      LEDGER_FLYWAY_ENABLED: "false"
      LEDGER_MESSAGING_ENABLED: "true"
      LEDGER_OUTBOX_PUBLISHER_ENABLED: "false"
      LEDGER_PAYMENT_WORKER_ENABLED: "true"
      LEDGER_DATABASE_POOL_SIZE: 8
    depends_on:
      api:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  seed:
    image: postgres:17.11-bookworm
    profiles: ["tools"]
    environment:
      PGPASSWORD: ${LEDGER_OWNER_PASSWORD:?LEDGER_OWNER_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:-ledgerguard}
      PGHOST: postgres
      PGUSER: ledger_owner
      LEDGER_DEMO_PASSWORD: ${LEDGER_DEMO_PASSWORD:?LEDGER_DEMO_PASSWORD is required}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - "psql -X -v ON_ERROR_STOP=1 -f /seed/seed.sql && psql -X -v ON_ERROR_STOP=1 -f /seed/seed-auth.sql"
    volumes:
      - ./infra/docker/postgres:/seed:ro
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    networks:
      - ledgerguard

volumes:
  ledgerguard-postgres:
    name: ${COMPOSE_PROJECT_NAME:-ledgerguard}-postgres
  ledgerguard-rabbit:
    name: ${COMPOSE_PROJECT_NAME:-ledgerguard}-rabbit

networks:
  ledgerguard:
    name: ${COMPOSE_PROJECT_NAME:-ledgerguard}-network
